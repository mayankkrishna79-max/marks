<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d6efd">
<title>DEO Office - Marks Folio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%200%22%20100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
@page {
  size: A4 portrait;
  margin: 0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #eef1f5;
  font-family: "Nirmala UI", "Mangal", "Arial Unicode MS", Arial, sans-serif;
  color: #111;
}
body { padding: 8px; }
.app { max-width: 1100px; margin: auto; }

/* Toolbar */
.toolbar {
  background: #fff;
  border-radius: 8px;
  padding: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px #0002;
  margin-bottom: 8px;
  position: sticky;
  top: 0;
  z-index: 100;
}
button {
  border: 0;
  border-radius: 6px;
  padding: 7px 11px;
  font-weight: 700;
  cursor: pointer;
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.primary { background: #0d6efd; color: #fff; }
.green { background: #198754; color: #fff; }
.gray { background: #6c757d; color: #fff; }
.danger { background: #dc3545; color: #fff; }
.warning { background: #fd7e14; color: #fff; }

/* Entry Panel */
.entry-panel {
  background: #fff;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px #0002;
}
.entry-title {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 8px;
  color: #0d6efd;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.entry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.entry-grid label { font-size: 11.5px; font-weight: 700; margin-bottom: 2px; display: block; }
.entry-grid input, .entry-grid select { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; font-size: 13px; background: #fff; }
.subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); gap: 5px; margin-top: 8px; }
.subject-box { border: 1px solid #ddd; border-radius: 5px; padding: 4px; background: #fafafa; }
.subject-box input.sub-name { border: 0; border-bottom: 1px dashed #888; border-radius: 0; background: transparent; font-weight: 700; font-size: 11px; text-align: center; padding: 2px 0; margin-bottom: 3px; width: 100%; }
.subject-box input.sub-marks { width: 100%; padding: 5px; border: 1px solid #bbb; border-radius: 4px; font-size: 13px; text-align: center; background: #fff; }
.status { font-size: 11px; color: #198754; font-weight: 700; margin-top: 6px; }
.form-actions { display: flex; gap: 6px; margin-top: 8px; }
.form-actions button { flex: 1; padding: 8px; }

/* Multi-Page Sheet Layout */
.paper-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 15px; }

.pages-wrap {
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
}

.paper {
  width: 210mm;
  height: 296.5mm;
  max-height: 296.5mm;
  background: #fff;
  padding: 5mm 8mm 4mm;
  box-shadow: 0 2px 10px #0002;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  overflow: hidden;
  position: relative;
  page-break-after: always;
  page-break-inside: avoid;
  break-after: page;
  break-inside: avoid;
}

.header { flex-shrink: 0; text-align: center; margin-bottom: 1mm; }
.h1 { font-size: 14.5px; font-weight: 700; text-decoration: underline; margin: 0; line-height: 1.2; }
.h2 { font-size: 13px; font-weight: 700; text-decoration: underline; margin-top: 1px; }

.info { flex-shrink: 0; font-size: 10.5px; line-height: 1.45; margin-bottom: 1mm; }
.info-row { display: grid; grid-template-columns: 28mm 1fr 18mm 1fr; gap: 2mm; align-items: end; }
.info-row.wide { grid-template-columns: 28mm 1fr; }
.info label { font-weight: 700; white-space: nowrap; }
.info input { width: 100%; border: 0; border-bottom: 1px dotted #555; outline: 0; font-family: inherit; font-size: 10.5px; height: 4.5mm; padding: 0 1mm; background: transparent; }
.info .marks { font-weight: 700; }

.table-wrap {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 9.5px;
}
th, td { border: 0.3mm solid #222; text-align: center; padding: 0; }
thead th { height: 7mm; font-weight: 700; vertical-align: middle; line-height: 1.05; }
tbody tr { height: 5.8mm; max-height: 5.8mm; }

th.col-sr, td.col-sr { width: 9mm; }
th.col-roll, td.col-roll { width: 11mm; }
th.col-name, td.col-name { width: auto; }
th.col-sub, td.col-sub { width: 13mm; }
th.col-total, td.col-total { width: 12mm; }

td input { width: 100%; height: 100%; border: 0; outline: 0; background: transparent; text-align: center; font-family: inherit; font-size: 10px; padding: 0; }
td.name input { text-align: left; padding-left: 1.5mm; }
td.total { font-weight: 700; }

.note { flex-shrink: 0; font-size: 9px; margin-top: 1.5mm; font-weight: 600; line-height: 1.1; }
.signatures {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5mm;
  margin-top: 3.5mm;
  font-size: 9.5px;
  font-weight: 700;
  text-align: center;
  page-break-inside: avoid;
  break-inside: avoid;
}
.sig { border-top: 1px dashed #888; padding-top: 1.5mm; line-height: 1.25; }

/* Dialog Box */
.dialog-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
.dialog-box { background: #fff; border-radius: 8px; padding: 16px; width: 90%; max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

/* Mandatory Follow Popup */
.popup-bg { 
  position: fixed; 
  inset: 0; 
  background: rgba(0, 0, 0, 0.85); 
  backdrop-filter: blur(4px); 
  display: none; 
  align-items: center; 
  justify-content: center; 
  z-index: 9999; 
  padding: 15px; 
}
.popup { 
  width: 100%; 
  max-width: 350px; 
  background: white; 
  border-radius: 14px; 
  padding: 24px 20px; 
  text-align: center; 
  box-shadow: 0 15px 40px rgba(0,0,0,0.5); 
}
.popup h3 { margin: 0 0 10px; font-size: 19px; color: #111; }
.popup p { margin: 0 0 18px; line-height: 1.5; font-size: 13.5px; color: #444; }
.follow-btn { 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  gap: 8px; 
  background: #25D366; 
  color: white; 
  border: 0; 
  border-radius: 8px; 
  padding: 12px; 
  font-weight: 800; 
  font-size: 15px; 
  width: 100%; 
  cursor: pointer; 
  box-shadow: 0 4px 10px rgba(37,211,102,0.3); 
}
.small { font-size: 11px; color: #888; margin-top: 12px; }

@media print {
  html, body {
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .toolbar, .entry-panel, .dialog-bg, .popup-bg { display: none !important; }
  .paper-container { overflow: visible !important; padding: 0 !important; }
  .pages-wrap { gap: 0 !important; }
  .paper {
    margin: 0 !important;
    width: 210mm !important;
    height: 296.5mm !important;
    max-height: 296.5mm !important;
    box-shadow: none !important;
    padding: 5mm 8mm 4mm !important;
    page-break-after: always !important;
    page-break-inside: avoid !important;
    break-after: page !important;
    break-inside: avoid !important;
  }
  input { color: #000 !important; }
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button class="primary" onclick="addStudent()">＋ विद्यार्थी</button>
    <button class="danger" onclick="removeStudent()">— अंतिम विद्यार्थी हटाएं</button>
    <button class="warning" onclick="downloadPDF()">📥 Download A4 PDF</button>
    <button class="gray" onclick="window.print()">🖨 Print</button>
    <button class="green" onclick="saveData()">💾 Save</button>
    <button class="gray" onclick="loadData()">↻ Reload</button>
    <button class="danger" onclick="clearData()">Clear All</button>
  </div>

  <div class="entry-panel">
    <div class="entry-title">
      <span>📝 Marks Folio Entry Panel</span>
      <div style="display:flex;gap:4px">
        <button class="primary" style="padding:3px 7px;font-size:11px" onclick="addSubject()">＋ विषय जोड़ें</button>
        <button class="danger" style="padding:3px 7px;font-size:11px" onclick="openSubjectModal()">— विषय हटाएं</button>
      </div>
    </div>
    <div class="entry-grid">
      <div>
        <label>विद्यार्थी चुनें</label>
        <select id="studentSelect" onchange="selectStudent()"></select>
      </div>
      <div>
        <label>वर्ग क्रमांक</label>
        <input id="formRoll" inputmode="numeric" oninput="formChanged()">
      </div>
      <div style="grid-column: 1 / -1;">
        <label>विद्यार्थी का नाम</label>
        <input id="formName" oninput="formChanged()">
      </div>
    </div>

    <div class="subject-grid" id="subjectGrid"></div>

    <div class="form-actions">
      <button class="primary" onclick="nextStudent()">Next Student →</button>
      <button class="green" onclick="saveData()">💾 Save</button>
    </div>
    <div class="status" id="saveStatus">✓ Auto-save चालू है</div>
  </div>

  <div class="paper-container">
    <div class="pages-wrap" id="pagesWrap"></div>
  </div>
</div>

<!-- Modal for selecting which subject to remove -->
<div class="dialog-bg" id="subModal">
  <div class="dialog-box">
    <h4 style="margin:0 0 10px 0;font-size:15px">कौन सा विषय हटाना चाहते हैं?</h4>
    <select id="delSubSelect" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:5px;font-size:13px;margin-bottom:12px"></select>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="gray" onclick="closeSubjectModal()">रद्द करें</button>
      <button class="danger" onclick="confirmRemoveSubject()">हटाएं</button>
    </div>
  </div>
</div>

<!-- Mandatory First-Time WhatsApp Follow Popup -->
<div class="popup-bg" id="followPopup">
  <div class="popup">
    <h3>📢 DEO Office से जुड़ें</h3>
    <p>बिहार शिक्षा विभाग से जुड़े सभी जरूरी प्रपत्र, अंक पत्रक और ताजा अपडेट पाने के लिए हमारे WhatsApp चैनल को Follow करें।</p>
    <button class="follow-btn" onclick="handleMandatoryFollow()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
      Follow DEO Office
    </button>
    <div class="small">आगे बढ़ने के लिए Follow करना अनिवार्य है।</div>
  </div>
</div>

<script>
const ROWS_PER_PAGE = 25;
let subjects = ["हिंदी", "गणित", "अंग्रेजी", "संस्कृत", "सा० विज्ञान", "विज्ञान"];
let students = [];
let details = { center: "", district: "", school: "", udise: "", block: "", className: "", maxMarks: "50" };
let selectedStudent = 0;

function esc(s){ return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// Mandatory follow handler
function checkMandatoryPopup(){
  if(localStorage.getItem("deoFollowCompleted") !== "1"){
    document.getElementById("followPopup").style.display = "flex";
  }
}

function handleMandatoryFollow(){
  window.open("https://whatsapp.com/channel/0029VaVz8W38kyyTFnPsIA0O", "_blank");
  localStorage.setItem("deoFollowCompleted", "1");
  document.getElementById("followPopup").style.display = "none";
}

function renderSubjectControls(){
  const grid = document.getElementById("subjectGrid");
  grid.innerHTML = subjects.map((sub, i) => `
    <div class="subject-box">
      <input class="sub-name" value="${esc(sub)}" title="नाम एडिट करें" oninput="updateSubjectName(${i}, this.value)">
      <input class="sub-marks" id="m${i}" inputmode="numeric" placeholder="0" oninput="formChanged()">
    </div>
  `).join("");
}

function updateSubjectName(idx, val){
  subjects[idx] = val || `विषय ${idx+1}`;
  renderPages();
  autoSave();
}

function addSubject(){
  const name = prompt("नए विषय का नाम दर्ज करें:", `विषय ${subjects.length + 1}`);
  if(name && name.trim()){
    subjects.push(name.trim());
    students.forEach(s => {
      while(s.marks.length < subjects.length) s.marks.push("");
    });
    renderSubjectControls();
    renderPages();
    selectStudent();
    autoSave();
  }
}

function openSubjectModal(){
  if(subjects.length <= 1){
    alert("कम से कम एक विषय होना अनिवार्य है!");
    return;
  }
  const sel = document.getElementById("delSubSelect");
  sel.innerHTML = subjects.map((s, i) => `<option value="${i}">${i+1}. ${esc(s)}</option>`).join("");
  document.getElementById("subModal").style.display = "flex";
}

function closeSubjectModal(){
  document.getElementById("subModal").style.display = "none";
}

function confirmRemoveSubject(){
  const sel = document.getElementById("delSubSelect");
  const idx = Number(sel.value);
  if(!isNaN(idx) && idx >= 0 && idx < subjects.length){
    subjects.splice(idx, 1);
    students.forEach(s => {
      s.marks.splice(idx, 1);
    });
    closeSubjectModal();
    renderSubjectControls();
    renderPages();
    selectStudent();
    autoSave();
  }
}

function syncHeaderInputs(key, value){
  details[key] = value;
  document.querySelectorAll(`.info-input-${key}`).forEach(el => {
    if(el.value !== value) el.value = value;
  });
  autoSave();
}

function renderPages(){
  const wrap = document.getElementById("pagesWrap");
  wrap.innerHTML = "";
  
  const totalPages = Math.max(1, Math.ceil(students.length / ROWS_PER_PAGE));
  
  for(let p = 0; p < totalPages; p++){
    const pageDiv = document.createElement("section");
    pageDiv.className = "paper";
    
    const startIdx = p * ROWS_PER_PAGE;
    let rowsHtml = "";

    for(let r = 0; r < ROWS_PER_PAGE; r++){
      const i = startIdx + r;
      if(i < students.length){
        const st = students[i];
        let subCells = "";
        let total = 0, any = false;
        
        for(let s = 0; s < subjects.length; s++){
          const m = st.marks[s] || "";
          if(m.trim()){
            any = true;
            if(m.toUpperCase() !== "ABSENT" && !isNaN(Number(m))) total += Number(m);
          }
          subCells += `<td class="col-sub"><input value="${esc(m)}" oninput="cellChanged(${i}, ${s}, this.value)"></td>`;
        }
        
        rowsHtml += `
          <tr>
            <td class="col-sr">${i + 1}</td>
            <td class="col-roll"><input value="${esc(st.roll)}" oninput="cellInfoChanged(${i}, 'roll', this.value)"></td>
            <td class="col-name name"><input value="${esc(st.name)}" oninput="cellInfoChanged(${i}, 'name', this.value)"></td>
            ${subCells}
            <td class="col-total total">${any ? total : "0"}</td>
          </tr>
        `;
      } else {
        const blankSub = subjects.map(() => `<td class="col-sub"></td>`).join("");
        rowsHtml += `
          <tr>
            <td class="col-sr">${i + 1}</td>
            <td class="col-roll"></td>
            <td class="col-name name"></td>
            ${blankSub}
            <td class="col-total total"></td>
          </tr>
        `;
      }
    }

    pageDiv.innerHTML = `
      <div class="header">
        <div class="h1">राज्य शिक्षा शोध एवं प्रशिक्षण परिषद, बिहार, पटना</div>
        <div class="h2">अंक पत्रक (Marks Folio) ${totalPages > 1 ? `[पृष्ठ ${p+1}/${totalPages}]` : ""}</div>
      </div>

      <div class="info">
        <div class="info-row">
          <label>मूल्यांकन केंद्र का नाम :-</label><input class="info-input-center" value="${esc(details.center)}" oninput="syncHeaderInputs('center', this.value)">
          <label>जिला :-</label><input class="info-input-district" value="${esc(details.district)}" oninput="syncHeaderInputs('district', this.value)">
        </div>
        <div class="info-row wide">
          <label>विद्यालय का नाम :-</label><input class="info-input-school" value="${esc(details.school)}" oninput="syncHeaderInputs('school', this.value)">
        </div>
        <div class="info-row">
          <label>यू-डायस :-</label><input class="info-input-udise" value="${esc(details.udise)}" oninput="syncHeaderInputs('udise', this.value)">
          <label>प्रखंड का नाम :-</label><input class="info-input-block" value="${esc(details.block)}" oninput="syncHeaderInputs('block', this.value)">
        </div>
        <div class="info-row">
          <label>वर्ग/उप वर्ग :-</label><input class="info-input-className" value="${esc(details.className)}" oninput="syncHeaderInputs('className', this.value)">
          <label>पूर्णांक :-</label><input class="info-input-maxMarks marks" value="${esc(details.maxMarks)}" oninput="syncHeaderInputs('maxMarks', this.value)">
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-sr">क्र०सं०</th>
              <th class="col-roll">वर्ग<br>क्रमांक</th>
              <th class="col-name">विद्यार्थियों का नाम</th>
              ${subjects.map(s => `<th class="col-sub">${esc(s)}</th>`).join("")}
              <th class="col-total">कुल</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>

      <div class="note">※ अनुपस्थित परीक्षार्थी के कॉलम में लाल कलम से प्राप्तांक कॉलम में अनुपस्थित (ABSENT) दर्ज करें।</div>

      <div class="signatures">
        <div class="sig">परीक्षक का नाम एवं हस्ताक्षर<br>तिथि सहित</div>
        <div class="sig">प्रधान परीक्षक का नाम एवं<br>हस्ताक्षर तिथि सहित</div>
        <div class="sig">मूल्यांकन निदेशक का<br>हस्ताक्षर एवं मुहर</div>
      </div>
    `;
    wrap.appendChild(pageDiv);
  }
}

function cellChanged(stIdx, subIdx, val){
  students[stIdx].marks[subIdx] = val;
  if(stIdx === selectedStudent){
    const formInput = document.getElementById("m" + subIdx);
    if(formInput) formInput.value = val;
  }
  renderPages();
  autoSave();
}

function cellInfoChanged(stIdx, key, val){
  students[stIdx][key] = val;
  if(stIdx === selectedStudent){
    if(key === 'name') document.getElementById("formName").value = val;
    if(key === 'roll') document.getElementById("formRoll").value = val;
  }
  syncFormOptions();
  autoSave();
}

function syncFormOptions(){
  const previous = selectedStudent;
  const studentSelect = document.getElementById("studentSelect");
  studentSelect.innerHTML = "";
  students.forEach((r, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `${i + 1}. ${r.name || "नया विद्यार्थी"}`;
    studentSelect.appendChild(opt);
  });
  selectedStudent = Math.min(previous, Math.max(0, students.length - 1));
  studentSelect.value = selectedStudent;
}

function selectStudent(){
  selectedStudent = Number(document.getElementById("studentSelect").value) || 0;
  const st = students[selectedStudent];
  if(!st) return;
  document.getElementById("formRoll").value = st.roll || "";
  document.getElementById("formName").value = st.name || "";
  for(let i = 0; i < subjects.length; i++){
    const input = document.getElementById("m" + i);
    if(input) input.value = st.marks[i] || "";
  }
}

function formChanged(){
  const st = students[selectedStudent];
  if(!st) return;
  st.roll = document.getElementById("formRoll").value;
  st.name = document.getElementById("formName").value;
  for(let i = 0; i < subjects.length; i++){
    const val = document.getElementById("m" + i)?.value || "";
    st.marks[i] = val;
  }
  renderPages();
  syncFormOptions();
  document.getElementById("studentSelect").value = selectedStudent;
  autoSave();
}

function addStudent(){
  students.push({ roll: "", name: "", marks: new Array(subjects.length).fill("") });
  renderPages();
  syncFormOptions();
  selectedStudent = students.length - 1;
  document.getElementById("studentSelect").value = selectedStudent;
  selectStudent();
  autoSave();
}

function removeStudent(){
  if(students.length > 1){
    students.pop();
    renderPages();
    syncFormOptions();
    selectedStudent = Math.min(selectedStudent, students.length - 1);
    selectStudent();
    autoSave();
  }
}

function nextStudent(){
  if(selectedStudent < students.length - 1){
    selectedStudent++;
    document.getElementById("studentSelect").value = selectedStudent;
    selectStudent();
  } else {
    addStudent();
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function autoSave(){
  localStorage.setItem("deoMarksFolio_Dynamic", JSON.stringify({ subjects, details, students }));
  document.getElementById("saveStatus").textContent = "✓ Auto-saved • " + new Date().toLocaleTimeString("hi-IN");
}

function saveData(){
  autoSave();
  alert("डेटा सुरक्षित कर दिया गया है।");
}

function loadData(){
  const raw = localStorage.getItem("deoMarksFolio_Dynamic");
  if(raw){
    try {
      const d = JSON.parse(raw);
      if(d.subjects && Array.isArray(d.subjects)) subjects = d.subjects;
      if(d.details) details = Object.assign(details, d.details);
      if(d.students && Array.isArray(d.students)) students = d.students;
    } catch(e){}
  }
  renderSubjectControls();
  
  if(students.length === 0){
    for(let i = 0; i < 15; i++){
      students.push({ roll: "", name: "", marks: new Array(subjects.length).fill("") });
    }
  }
  renderPages();
  syncFormOptions();
  selectedStudent = 0;
  selectStudent();
}

function clearData(){
  if(confirm("क्या आप पूरा डेटा रीसेट करना चाहते हैं?")){
    localStorage.removeItem("deoMarksFolio_Dynamic");
    location.reload();
  }
}

function downloadPDF(){
  const element = document.getElementById("pagesWrap");
  const opt = {
    margin: 0,
    filename: `Marks_Folio_${details.className || 'Report'}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };
  html2pdf().set(opt).from(element).save();
}

loadData();
checkMandatoryPopup();
</script>
</body>
