<style>

@page{

*{

html,body{

/* ================= TOOLBAR ================= */

.toolbar{
    background:#fff;
    border-radius:8px;
    padding:8px;
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap:wrap;

}

button{

.primary{

}

.green{

}

.gray{

.danger{

/* ================= ENTRY PANEL ================= */

.entry-panel{
    background:#fff;
    border-radius:8px;
    padding:10px;

    box-shadow:0 2px 8px #0002;
}

.entry-title{
    font-size:15.5px;
    font-weight:800;
    margin-bottom:8px;
    color:#0d6efd;
    display:flex;
    justify-content:space-between;

}

.entry-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:6px;
}

.entry-grid label{
    font-size:12px;
    font-weight:700;
    margin-bottom:2px;
    display:block;
}

.entry-grid input,
.entry-grid select{
    width:100%;
    padding:6px 8px;
    border:1px solid #ccc;
    border-radius:5px;
    font-family:inherit;
    font-size:13.5px;
    background:#fff;
}

.subject-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(85px,1fr));
    gap:5px;
    margin-top:8px;
}

.subject-box{
    border:1px solid #ddd;
    border-radius:5px;
    padding:4px;

}

.subject-box input.sub-name{

    background:transparent;
    font-weight:700;
    font-size:11.5px;

    padding:2px 0;

}

.subject-box input.sub-marks{

    padding:5px;
    border:1px solid #bbb;
    border-radius:4px;
    font-size:13.5px;
    text-align:center;

}

.status{

}

.form-actions{

    gap:6px;
    margin-top:8px;

.form-actions button{

}

/* ================= MOBILE SCROLL CONTAINER ================= */

.paper-container{

    overflow:auto;
    -webkit-overflow-scrolling:touch;
    padding:8px 4px 25px;

    overscroll-behavior:contain;
}

.pages-wrap{
    display:flex;
    flex-direction:column;
    gap:15px;
    align-items:center;
    
    /* Allows complete vertical scrolling */
    min-height:100%;
}

/* ================= A4 PAPER ================= */

.paper{
    width:210mm;
    height:297mm;
    min-width:210mm;
    max-width:210mm;
    min-height:297mm;
    max-height:297mm;

    background:#fff;

    padding:3mm 7.5mm 2.5mm;

    box-shadow:0 2px 10px #0002;

    display:flex;
    flex-direction:column;

    box-sizing:border-box;

    overflow:hidden;

    position:relative;

    page-break-after:always;
    page-break-inside:avoid;

    break-inside:avoid;
}

/* ================= HEADER ================= */

.header{

}

.h1{

.h2{

/* ================= INFO ================= */

.info{

.info-row{

.info label{

.info input{

th,

<script>

/* ==========================================================
   WHATSAPP CHANNEL
   ========================================================== */

const CHANNEL_LINK =
"https://whatsapp.com/channel/0029VaIhMoY35fM4YK5xrz3P";


/* ==========================================================
   SETTINGS
   ========================================================== */

const ROWS_PER_PAGE = 30;


/*
   Default Subjects

   हर विषय का पूर्णांक = 50
*/

let subjects = [
    "हिन्दी/राष्ट्र भाषा",
    "गणित",
    "अंग्रेजी",
    "संस्कृत/उर्दू",
    "सा० विज्ञान",
    "विज्ञान"
];


/* ================= DATA ================= */

let students = [];

let details = {
    center:"",
    district:"",
    school:"",
    udise:"",
    block:"",
    className:"",
    maxMarks:"50"
};

let selectedStudent = 0;


/* ================= ESCAPE ================= */

function esc(s){

    return String(s || "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/* ==========================================================
   GRADE CALCULATION

   Each subject = 50 marks

   AB / ABSENT = 0

   A = 81-100%
   B = 61-80%
   C = 41-60%
   D = 33-40%
   E = 0-32%
   ========================================================== */

function calculateResult(st){

    let total = 0;

    const maximum =
        subjects.length * 50;

    for(let i=0;i<subjects.length;i++){

        let value =
            String(st.marks[i] || "").trim();

        /*
           AB / ABSENT को 0 माना जाएगा
        */

        if(
            value.toUpperCase() === "AB" ||
            value.toUpperCase() === "ABSENT" ||
            value === ""
        ){

            continue;

        }

        let n = Number(value);

        if(
            !isNaN(n) &&
            n >= 0
        ){

            total += n;

        }

    }

    let percentage = 0;

    if(maximum > 0){

        percentage =
            (total / maximum) * 100;

    }


    let grade = "E";


    if(percentage >= 81){

        grade = "A";

    }
    else if(percentage >= 61){

        grade = "B";

    }
    else if(percentage >= 41){

        grade = "C";

    }
    else if(percentage >= 33){

        grade = "D";

    }
    else{

        grade = "E";

    }


    return {
        total:total,
        percentage:percentage,
        grade:grade
    };

}


/* ==========================================================
   VIEW COUNTER
   ========================================================== */

function updateViews(){

    fetch(
        "https://api.counterapi.dev/v1/deo_marks_folio_bihar/views/up"
    )

    .then(res => res.json())

    .then(data => {

        if(data && data.count){

            document.getElementById(
                "viewCount"
            ).textContent =
                Number(data.count)
                .toLocaleString("hi-IN");

        }

    })

    .catch(() => {

        let localViews =
            Number(
                localStorage.getItem(
                    "deo_local_views"
                ) || 1054
            ) + 1;

        localStorage.setItem(
            "deo_local_views",
            localViews
        );

        document.getElementById(
            "viewCount"
        ).textContent =
            localViews.toLocaleString("hi-IN");

    });

}


/* ==========================================================
   SHARE
   ========================================================== */

    const shareData = {

        url:
            window.location.href

    };


    if(navigator.share){

        navigator.share(
            shareData
        ).catch(()=>{});

    }
    else{

        if(navigator.clipboard){

            navigator.clipboard
                .writeText(
                    window.location.href
                )

                .then(()=>{

                    alert(
                        "📋 लिंक क्लिपबोर्ड पर कॉपी हो गया है!"
                    );

                })

                .catch(()=>{

                    openWhatsAppShare();

                });

        }
        else{

            openWhatsAppShare();

        }

    }

}


function openWhatsAppShare(){

    const text =
        "बिहार विद्यालय अंक पत्रक (Marks Folio) ऑनलाइन भरें और A4 PDF डाउनलोड करें: "
        + window.location.href;

    window.open(
        "https://api.whatsapp.com/send?text="
        + encodeURIComponent(text),
        "_blank"
    );

}

function updateSubjectName(idx,val){

/* ==========================================================
   ADD SUBJECT
   ========================================================== */

function addSubject(){

    const name =
        prompt(
            "नए विषय का नाम दर्ज करें:",
            `विषय ${subjects.length+1}`
        );


    if(
        name &&
        name.trim()
    ){

        subjects.push(
            name.trim()
        );


        students.forEach(
            s=>{

                while(
                    s.marks.length <
                    subjects.length
                ){

                    s.marks.push("");

                }

            }
        );


        renderSubjectControls();

        renderPages();

        selectStudent();

        autoSave();

    }

}

/* ==========================================================
   DELETE SUBJECT
   ========================================================== */

function confirmRemoveSubject(){

    const sel =
        document.getElementById(
            "delSubSelect"
        );

    const idx =
        Number(sel.value);


    if(
        isNaN(idx) ||
        idx < 0 ||
        idx >= subjects.length
    ){

        return;

    }


    if(
        !confirm(
            `"${subjects[idx]}" विषय हटाना है?`
        )
    ){

        return;

    }


    subjects.splice(
        idx,
        1
    );


    students.forEach(
        s=>{

            if(
                Array.isArray(s.marks)
            ){

                s.marks.splice(
                    idx,
                    1
                );

            }

        }
    );


    closeSubjectModal();

    renderSubjectControls();

    renderPages();

    selectStudent();

    autoSave();

}

/* ==========================================================
   CELL MARKS CHANGE
   ========================================================== */

function cellChanged(
    stIdx,
    subIdx,
    val
){

    if(
        !students[stIdx]
    ){

        return;

    }


    if(
        !Array.isArray(
            students[stIdx].marks
        )
    ){

        students[stIdx].marks = [];

    }


    students[stIdx]
        .marks[subIdx] =
        val;


    if(
        stIdx === selectedStudent
    ){

        const formInput =
            document.getElementById(
                "m" + subIdx
            );


        if(formInput){

            formInput.value =
                val;

        }

    }


    renderPages();

    autoSave();

}


/* ==========================================================
   CELL INFO CHANGE
   ========================================================== */

function cellInfoChanged(
    stIdx,
    key,
    val
){

    if(
        !students[stIdx]
    ){

        return;

    }


    students[stIdx][key] =
        val;


    if(
        stIdx === selectedStudent
    ){

        if(
            key === "name"
        ){

            document.getElementById(
                "formName"
            ).value = val;

        }


        if(
            key === "roll"
        ){

            document.getElementById(
                "formRoll"
            ).value = val;

        }

    }


    syncFormOptions();

    renderPages();

    autoSave();

}


/* ==========================================================
   STUDENT SELECT OPTIONS
   ========================================================== */

function syncFormOptions(){

    const previous =
        selectedStudent;


    const studentSelect =
        document.getElementById(
            "studentSelect"
        );


    studentSelect.innerHTML = "";


    students.forEach(
        (r,i)=>{

            const opt =
                document.createElement(
                    "option"
                );


            opt.value =
                i;


            opt.textContent =
                `${i+1}. ${r.name || "नया विद्यार्थी"}`;


            studentSelect.appendChild(
                opt
            );

        }
    );


    if(
        students.length > 0
    ){

        selectedStudent =
            Math.min(
                previous,
                students.length - 1
            );

        studentSelect.value =
            selectedStudent;

    }

}


/* ==========================================================
   SELECT STUDENT
   ========================================================== */

function selectStudent(){

    if(
        students.length === 0
    ){

        return;

    }


    selectedStudent =
        Number(
            document.getElementById(
                "studentSelect"
            ).value
        ) || 0;


    const st =
        students[selectedStudent];


    if(!st){

        return;

    }


    document.getElementById(
        "formRoll"
    ).value =
        st.roll || "";


    document.getElementById(
        "formName"
    ).value =
        st.name || "";


    for(
        let i=0;
        i<subjects.length;
        i++
    ){

        const input =
            document.getElementById(
                "m" + i
            );


        if(input){

            input.value =
                st.marks[i] || "";

        }

    }

}


/* ==========================================================
   FORM CHANGE
   ========================================================== */

function formChanged(){

    const st =
        students[selectedStudent];


    if(!st){

        return;

    }


    st.roll =
        document.getElementById(
            "formRoll"
        ).value;


    st.name =
        document.getElementById(
            "formName"
        ).value;


    if(
        !Array.isArray(st.marks)
    ){

        st.marks = [];

    }


    for(
        let i=0;
        i<subjects.length;
        i++
    ){

        const input =
            document.getElementById(
                "m" + i
            );


        st.marks[i] =
            input
            ? input.value
            : "";

    }


    renderPages();

    syncFormOptions();


    document.getElementById(
        "studentSelect"
    ).value =
        selectedStudent;


    autoSave();

}


/* ==========================================================
   ADD STUDENT
   ========================================================== */

function addStudent(){

    students.push({

        roll:"",
        name:"",
        marks:
            new Array(
                subjects.length
            ).fill("")

    });


    renderPages();

    syncFormOptions();


    selectedStudent =
        students.length - 1;


    document.getElementById(
        "studentSelect"
    ).value =
        selectedStudent;


    selectStudent();

    autoSave();

}


/* ==========================================================
   DELETE LAST STUDENT

   Fixed delete option
   ========================================================== */

function removeStudent(){

    if(
        students.length <= 1
    ){

        alert(
            "कम से कम एक विद्यार्थी रखना आवश्यक है।"
        );

        return;

    }


    const lastIndex =
        students.length - 1;


    const lastName =
        students[lastIndex].name ||
        `विद्यार्थी ${students.length}`;


    if(
        !confirm(
            `"${lastName}" को हटाना है?`
        )
    ){

        return;

    }


    students.pop();


    if(
        selectedStudent >=
        students.length
    ){

        selectedStudent =
            students.length - 1;

    }


    renderPages();

    syncFormOptions();

    selectStudent();

    autoSave();

}


/* ==========================================================
   NEXT STUDENT
   ========================================================== */

function nextStudent(){

    if(
        selectedStudent <
        students.length - 1
    ){

        selectedStudent++;

    }
    else{

        addStudent();

        return;

    }


    document.getElementById(
        "studentSelect"
    ).value =
        selectedStudent;


    selectStudent();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==========================================================
   AUTO SAVE
   ========================================================== */

function autoSave(){

    localStorage.setItem(

        "deoMarksFolio_Final_v7",

        JSON.stringify({

            subjects:
                subjects,

            details:
                details,

            students:
                students

        })

    );


    const status =
        document.getElementById(
            "saveStatus"
        );


    if(status){

        status.textContent =
            "✓ Auto-saved • "
            +
            new Date()
            .toLocaleTimeString(
                "hi-IN"
            );

    }

}


/* ==========================================================
   SAVE
   ========================================================== */

function saveData(){

    autoSave();

    alert(
        "डेटा सुरक्षित कर दिया गया है।"
    );

}


/* ==========================================================
   LOAD
   ========================================================== */

function loadData(){

    const raw =
        localStorage.getItem(
            "deoMarksFolio_Final_v7"
        );


    if(raw){

        try{

            const d =
                JSON.parse(raw);


            if(
                Array.isArray(
                    d.subjects
                ) &&
                d.subjects.length
            ){

                subjects =
                    d.subjects;

            }


            if(d.details){

                details =
                    Object.assign(
                        details,
                        d.details
                    );

            }


            if(
                Array.isArray(
                    d.students
                )
            ){

                students =
                    d.students;

            }

        }
        catch(e){

            console.log(
                "Load error:",
                e
            );

        }

    }


    /*
       पुराने data में marks array कम हो
       तो subjects के अनुसार ठीक करें
    */

    students.forEach(
        s=>{

            if(
                !Array.isArray(
                    s.marks
                )
            ){

                s.marks = [];

            }


            while(
                s.marks.length <
                subjects.length
            ){

                s.marks.push("");

            }


            if(
                s.marks.length >
                subjects.length
            ){

                s.marks =
                    s.marks.slice(
                        0,
                        subjects.length
                    );

            }

        }
    );


    renderSubjectControls();


    /*
       पहली बार 30 विद्यार्थी
    */

    if(
        students.length === 0
    ){

        for(
            let i=0;
            i<30;
            i++
        ){

            students.push({

                roll:"",
                name:"",
                marks:
                    new Array(
                        subjects.length
                    ).fill("")

            });

        }

    }


    renderPages();

    syncFormOptions();

    selectedStudent = 0;

    selectStudent();

}


/* ==========================================================
   CLEAR
   ========================================================== */

function clearData(){

    if(
        confirm(
            "क्या आप पूरा डेटा रीसेट करना चाहते हैं?"
        )
    ){

        localStorage.removeItem(

    }

}
