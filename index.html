<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d6efd">

<title>DEO Office - Marks Folio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
@page{
  size:A4 portrait;
  margin:0;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#eef1f5;
  font-family:"Nirmala UI","Mangal","Arial Unicode MS",Arial,sans-serif;
  color:#111;
}

body{
  padding:8px;
  overflow-x:hidden;
}

.app{
  max-width:1100px;
  margin:auto;
}

/* ================= TOOLBAR ================= */

.toolbar{
  background:#fff;
  border-radius:8px;
  padding:8px;
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  box-shadow:0 2px 8px #0002;
  margin-bottom:8px;
  position:sticky;
  top:0;
  z-index:100;
}

button{
  border:0;
  border-radius:6px;
  padding:7px 11px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.primary{background:#0d6efd;color:#fff}
.green{background:#198754;color:#fff}
.gray{background:#6c757d;color:#fff}
.danger{background:#dc3545;color:#fff}
.warning{background:#fd7e14;color:#fff}
.share-btn{background:#6f42c1;color:#fff}

.view-badge{
  background:#e9ecef;
  color:#333;
  padding:6px 10px;
  border-radius:6px;
  font-size:12.5px;
  font-weight:700;
  margin-left:auto;
}

/* ================= ENTRY PANEL ================= */

.entry-panel{
  background:#fff;
  border-radius:8px;
  padding:10px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0002;
}

.entry-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:8px;
  color:#0d6efd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}

.entry-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:6px;
}

.entry-grid label{
  font-size:12px;
  font-weight:700;
  margin-bottom:2px;
  display:block;
}

.entry-grid input,
.entry-grid select{
  width:100%;
  padding:6px 8px;
  border:1px solid #ccc;
  border-radius:5px;
  font-family:inherit;
  font-size:13.5px;
  background:#fff;
}

.subject-manager{
  margin-top:9px;
  padding:8px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#fafafa;
}

.subject-manager-title{
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.subject-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.subject-item{
  display:flex;
  align-items:center;
  gap:3px;
  background:#fff;
  border:1px solid #ccc;
  border-radius:5px;
  padding:3px 5px;
}

.subject-item input{
  width:105px;
  border:0;
  outline:0;
  font-family:inherit;
  font-weight:700;
  font-size:12px;
  background:transparent;
}

.subject-item button{
  padding:2px 5px;
  font-size:11px;
}

.form-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.form-actions button{
  flex:1;
  padding:8px;
}

.status{
  font-size:11.5px;
  color:#198754;
  font-weight:700;
  margin-top:6px;
}

/* ================= MOBILE PAPER VIEW ================= */

.paper-container{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  scroll-behavior:smooth;
  padding:5px 0 20px;
}

.paper-container::-webkit-scrollbar{
  height:8px;
}

.paper-container::-webkit-scrollbar-thumb{
  background:#888;
  border-radius:10px;
}

.pages-wrap{
  display:flex;
  flex-direction:column;
  gap:15px;
  align-items:center;
  min-width:max-content;
}

/* ================= A4 PAPER ================= */

.paper{
  width:210mm;
  height:297mm;
  min-width:210mm;
  max-height:297mm;
  background:#fff;

  padding:3mm 7.5mm 2.5mm;

  box-shadow:0 2px 10px #0002;

  display:flex;
  flex-direction:column;

  overflow:hidden;
  position:relative;

  page-break-after:always;
  page-break-inside:avoid;
  break-after:page;
  break-inside:avoid;
}

/* ================= HEADER ================= */

.header{
  flex-shrink:0;
  text-align:center;
  margin-bottom:.8mm;
}

.h1{
  font-size:15.5px;
  font-weight:700;
  text-decoration:underline;
  margin:0;
  line-height:1.2;
}

.h2{
  font-size:14px;
  font-weight:700;
  text-decoration:underline;
  margin-top:1px;
}

/* ================= INFO ================= */

.info{
  flex-shrink:0;
  font-size:11.5px;
  line-height:1.4;
  margin-bottom:1mm;
}

.info-row{
  display:grid;
  grid-template-columns:29mm 1fr 19mm 1fr;
  gap:2mm;
  align-items:end;
}

.info-row.wide{
  grid-template-columns:29mm 1fr;
}

.info label{
  font-weight:700;
  white-space:nowrap;
}

.info input{
  width:100%;
  border:0;
  border-bottom:1px dotted #555;
  outline:0;
  font-family:inherit;
  font-size:11.5px;
  height:4.8mm;
  padding:0 1mm;
  background:transparent;
}

.info .marks{
  font-weight:700;
}

/* ================= TABLE ================= */

.table-wrap{
  flex-shrink:0;
  width:100%;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:10.5px;
}

th,td{
  border:.3mm solid #222;
  text-align:center;
  padding:0;
}

thead th{
  height:8mm;
  font-weight:700;
  vertical-align:middle;
  line-height:1.1;
  font-size:10.5px;
}

tbody tr{
  height:7.2mm;
  max-height:7.2mm;
}

/* Column widths */

.col-sr{
  width:9mm;
}

.col-roll{
  width:13mm;
}

.col-name{
  width:45mm;
}

.col-sub{
  width:13mm;
}

.col-total{
  width:13mm;
}

.col-grade{
  width:14mm;
}

td input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  text-align:center;
  font-family:inherit;
  font-size:11px;
  padding:0;
}

td.name input{
  text-align:left;
  padding-left:1.5mm;
  font-size:11px;
}

td.total,
td.grade{
  font-weight:700;
  font-size:11px;
}

/* ================= NOTE ================= */

tfoot td.note-cell{
  border:0!important;
  text-align:left;
  font-size:10px;
  font-weight:600;
  padding-top:1mm;
  padding-bottom:.5mm;
  line-height:1.15;
}

/* ================= SIGNATURE ================= */

.signatures{
  margin-top:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5mm;
  margin-bottom:1.5mm;
  font-size:10.5px;
  font-weight:700;
  text-align:center;
  page-break-inside:avoid;
  break-inside:avoid;
}

.sig{
  border-top:1px dashed #666;
  padding-top:9mm;
  line-height:1.25;
}

/* ================= MODAL ================= */

.dialog-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
}

.dialog-box{
  background:#fff;
  border-radius:8px;
  padding:16px;
  width:90%;
  max-width:340px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
}

/* ================= POPUP ================= */

.popup-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:15px;
}

.popup{
  width:100%;
  max-width:350px;
  background:white;
  border-radius:14px;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.popup h3{
  margin:0 0 10px;
  font-size:19px;
}

.popup p{
  margin:0 0 18px;
  line-height:1.5;
  font-size:13.5px;
  color:#444;
}

.follow-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#25D366;
  color:white;
  border:0;
  border-radius:8px;
  padding:12px;
  font-weight:800;
  font-size:15px;
  width:100%;
}

.small{
  font-size:11px;
  color:#888;
  margin-top:12px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  body{
    padding:4px;
  }

  .toolbar{
    position:sticky;
    top:0;
  }

  .toolbar button{
    flex:1 1 calc(33% - 5px);
    padding:8px 4px;
    font-size:12px;
  }

  .view-badge{
    width:100%;
    justify-content:center;
    margin-left:0;
    order:-1;
    margin-bottom:4px;
  }

  .paper-container{
    margin-top:4px;
    touch-action:pan-x pan-y;
  }

  .pages-wrap{
    align-items:flex-start;
  }

  .paper{
    box-shadow:0 1px 6px #0003;
  }
}

/* ================= PRINT ================= */

@media print{

  html,body{
    background:#fff!important;
    padding:0!important;
    margin:0!important;
  }

  .toolbar,
  .entry-panel,
  .dialog-bg,
  .popup-bg{
    display:none!important;
  }

  .paper-container{
    overflow:visible!important;
    padding:0!important;
  }

  .pages-wrap{
    gap:0!important;
  }

  .paper{
    margin:0!important;
    width:210mm!important;
    min-width:210mm!important;
    height:297mm!important;
    max-height:297mm!important;
    box-shadow:none!important;
    padding:3mm 7.5mm 2.5mm!important;
    page-break-after:always!important;
    page-break-inside:avoid!important;
    break-after:page!important;
    break-inside:avoid!important;
  }

  input{
    color:#000!important;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= TOOLBAR ================= -->

<div class="toolbar">

<button class="primary" onclick="addStudent()">
＋ विद्यार्थी
</button>

<button class="danger" onclick="removeStudent()">
— विद्यार्थी हटाएं
</button>

<button class="warning" onclick="downloadPDF()">
📥 PDF
</button>

<button class="gray" onclick="window.print()">
🖨 Print
</button>

<button class="share-btn" onclick="shareApp()">
🔗 Share
</button>

<button class="green" onclick="saveData()">
💾 Save
</button>

<button class="gray" onclick="loadData()">
↻ Reload
</button>

<button class="danger" onclick="clearData()">
Clear
</button>

<div class="view-badge">
👁️ Views: <span id="viewCount">...</span>
</div>

</div>


<!-- ================= ENTRY PANEL ================= -->

<div class="entry-panel">

<div class="entry-title">

<span>
📝 Marks Folio
</span>

<div style="display:flex;gap:4px;flex-wrap:wrap">

<button
class="primary"
style="padding:4px 7px;font-size:11px"
onclick="addSubject()">
＋ विषय
</button>

<button
class="danger"
style="padding:4px 7px;font-size:11px"
onclick="openSubjectModal()">
— विषय हटाएं
</button>

</div>

</div>


<div class="entry-grid">

<div>

<label>विद्यार्थी चुनें</label>

<select id="studentSelect"
onchange="selectStudent()">
</select>

</div>

<div>

<label>वर्ग क्रमांक</label>

<input
id="formRoll"
inputmode="numeric"
oninput="formChanged()">

</div>

<div style="grid-column:1/-1">

<label>विद्यार्थी का नाम</label>

<input
id="formName"
oninput="formChanged()">

</div>

</div>


<!-- SUBJECT MANAGER -->

<div class="subject-manager">

<div class="subject-manager-title">
📚 विषय व्यवस्था
</div>

<div
class="subject-list"
id="subjectList">
</div>

</div>


<div class="form-actions">

<button
class="primary"
onclick="nextStudent()">
Next Student →
</button>

<button
class="green"
onclick="saveData()">
💾 Save
</button>

</div>

<div
class="status"
id="saveStatus">
✓ Auto-save चालू है
</div>

</div>


<!-- ================= PAPER ================= -->

<div class="paper-container">

<div
class="pages-wrap"
id="pagesWrap">
</div>

</div>

</div>


<!-- ================= DELETE SUBJECT MODAL ================= -->

<div
class="dialog-bg"
id="subModal">

<div class="dialog-box">

<h4 style="margin:0 0 10px">
कौन सा विषय हटाना चाहते हैं?
</h4>

<select
id="delSubSelect"
style="width:100%;padding:8px;border:1px solid #ccc;border-radius:5px;font-size:13px;margin-bottom:12px">
</select>

<div style="display:flex;gap:6px;justify-content:flex-end">

<button
class="gray"
onclick="closeSubjectModal()">
रद्द करें
</button>

<button
class="danger"
onclick="confirmRemoveSubject()">
हटाएं
</button>

</div>

</div>

</div>


<!-- ================= WHATSAPP POPUP ================= -->

<div
class="popup-bg"
id="followPopup">

<div class="popup">

<h3>
📢 DEO Office से जुड़ें
</h3>

<p>
बिहार शिक्षा विभाग से जुड़े सभी जरूरी प्रपत्र,
अंक पत्रक और ताजा अपडेट पाने के लिए हमारे
WhatsApp चैनल को Follow करें।
</p>

<button
class="follow-btn"
onclick="handleMandatoryFollow()">

<span>🟢</span>
Follow DEO Office

</button>

<div class="small">
आगे बढ़ने के लिए Follow करना अनिवार्य है।
</div>

</div>

</div>


<script>

/* ==========================================================
   WHATSAPP CHANNEL
========================================================== */

const CHANNEL_LINK =
"https://whatsapp.com/channel/0029VaIhMoY35fM4YK5xrz3P";


/* ==========================================================
   SETTINGS
========================================================== */

const ROWS_PER_PAGE = 30;

let subjects = [
  "हिन्दी/राष्ट्र भाषा",
  "अंग्रेजी",
  "गणित",
  "संस्कृत/उर्दू",
  "सा० विज्ञान",
  "विज्ञान"
];

let students = [];

let details = {
  center:"",
  district:"",
  school:"",
  udise:"",
  block:"",
  className:"",
  maxMarks:"50"
};

let selectedStudent = 0;


/* ==========================================================
   ESCAPE
========================================================== */

function esc(s){

  return String(s || "")
  .replace(/&/g,"&amp;")
  .replace(/"/g,"&quot;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}


/* ==========================================================
   GRADE
   खाली / 0 = F
========================================================== */

function getGrade(total){

  total = Number(total) || 0;

  const max =
    subjects.length * 50;

  if(total === 0)
    return "F";

  const percent =
    (total / max) * 100;

  if(percent >= 90) return "A+";
  if(percent >= 80) return "A";
  if(percent >= 70) return "B+";
  if(percent >= 60) return "B";
  if(percent >= 50) return "C";
  if(percent >= 40) return "D";

  return "F";
}


/* ==========================================================
   VIEW COUNTER
========================================================== */

function updateViews(){

  fetch(
    "https://api.counterapi.dev/v1/deo_marks_folio_bihar/views/up"
  )

  .then(res=>res.json())

  .then(data=>{

    if(data && data.count){

      document.getElementById(
        "viewCount"
      ).textContent =
      Number(data.count)
      .toLocaleString("hi-IN");

    }

  })

  .catch(()=>{

    let v =
      Number(
        localStorage.getItem("deo_local_views") || 1054
      ) + 1;

    localStorage.setItem(
      "deo_local_views",
      v
    );

    document.getElementById(
      "viewCount"
    ).textContent =
    v.toLocaleString("hi-IN");

  });

}


/* ==========================================================
   SHARE
========================================================== */

function shareApp(){

  const data = {

    title:"DEO Office - Marks Folio Maker",

    text:
    "बिहार विद्यालय अंक पत्रक ऑनलाइन भरें और A4 PDF डाउनलोड करें:",

    url:window.location.href

  };

  if(navigator.share){

    navigator.share(data).catch(()=>{});

  }else{

    navigator.clipboard
    .writeText(window.location.href)
    .then(()=>{

      alert(
        "📋 लिंक कॉपी हो गया है।"
      );

    })
    .catch(()=>{

      window.open(
        "https://api.whatsapp.com/send?text="+
        encodeURIComponent(
          data.text+" "+data.url
        ),
        "_blank"
      );

    });

  }

}


/* ==========================================================
   FOLLOW POPUP
========================================================== */

function checkMandatoryPopup(){

  if(
    localStorage.getItem(
      "deoFollowCompleted_v4"
    ) !== "1"
  ){

    document.getElementById(
      "followPopup"
    ).style.display="flex";

  }

}


function handleMandatoryFollow(){

  window.open(
    CHANNEL_LINK,
    "_blank"
  );

  localStorage.setItem(
    "deoFollowCompleted_v4",
    "1"
  );

  document.getElementById(
    "followPopup"
  ).style.display="none";

}


/* ==========================================================
   SUBJECT MANAGER
========================================================== */

function renderSubjectManager(){

  const box =
    document.getElementById("subjectList");

  box.innerHTML =
    subjects.map((sub,i)=>`

      <div class="subject-item">

        <span style="font-size:11px;font-weight:700">
          ${i+1}.
        </span>

        <input
          value="${esc(sub)}"
          onchange="renameSubject(${i},this.value)"
        >

        <button
          class="gray"
          onclick="moveSubject(${i},-1)"
          title="ऊपर">
          ↑
        </button>

        <button
          class="gray"
          onclick="moveSubject(${i},1)"
          title="नीचे">
          ↓
        </button>

      </div>

    `).join("");

}


function renameSubject(index,value){

  value =
    value.trim() ||
    "विषय "+(index+1);

  subjects[index]=value;

  renderSubjectManager();
  renderPages();
  autoSave();

}


function moveSubject(index,direction){

  const newIndex =
    index + direction;

  if(
    newIndex < 0 ||
    newIndex >= subjects.length
  ){
    return;
  }

  [
    subjects[index],
    subjects[newIndex]
  ] =
  [
    subjects[newIndex],
    subjects[index]
  ];

  students.forEach(st=>{

    [
      st.marks[index],
      st.marks[newIndex]
    ] =
    [
      st.marks[newIndex],
      st.marks[index]
    ];

  });

  renderSubjectManager();
  renderPages();
  autoSave();

}


/* ==========================================================
   ADD SUBJECT
========================================================== */

function addSubject(){

  const name =
    prompt(
      "नए विषय का नाम दर्ज करें:",
      "नया विषय"
    );

  if(
    name &&
    name.trim()
  ){

    subjects.push(
      name.trim()
    );

    students.forEach(st=>{

      while(
        st.marks.length <
        subjects.length
      ){

        st.marks.push("");

      }

    });

    renderSubjectManager();
    renderPages();
    autoSave();

  }

}


/* ==========================================================
   DELETE SUBJECT
========================================================== */

function openSubjectModal(){

  if(subjects.length <= 1){

    alert(
      "कम से कम एक विषय होना अनिवार्य है।"
    );

    return;
  }

  const select =
    document.getElementById(
      "delSubSelect"
    );

  select.innerHTML =
    subjects.map((s,i)=>`

      <option value="${i}">
        ${i+1}. ${esc(s)}
      </option>

    `).join("");

  document.getElementById(
    "subModal"
  ).style.display="flex";

}


function closeSubjectModal(){

  document.getElementById(
    "subModal"
  ).style.display="none";

}


function confirmRemoveSubject(){

  const select =
    document.getElementById(
      "delSubSelect"
    );

  const index =
    Number(select.value);

  if(
    isNaN(index) ||
    index < 0 ||
    index >= subjects.length
  ){

    return;

  }

  if(
    !confirm(
      "क्या आप \""+
      subjects[index]+
      "\" विषय को हटाना चाहते हैं?"
    )
  ){

    return;

  }

  subjects.splice(
    index,
    1
  );

  students.forEach(st=>{

    if(
      Array.isArray(st.marks)
    ){

      st.marks.splice(
        index,
        1
      );

    }

  });

  closeSubjectModal();

  renderSubjectManager();
  renderPages();
  autoSave();

}


/* ==========================================================
   HEADER INPUT
========================================================== */

function syncHeaderInputs(
  key,
  value
){

  details[key]=value;

  document
  .querySelectorAll(
    ".info-input-"+key
  )
  .forEach(el=>{

    if(el.value !== value){

      el.value=value;

    }

  });

  autoSave();

}


/* ==========================================================
   RENDER PAGES
========================================================== */

function renderPages(){

  const wrap =
    document.getElementById(
      "pagesWrap"
    );

  wrap.innerHTML="";

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        students.length /
        ROWS_PER_PAGE
      )
    );

  const totalCols =
    4 + subjects.length;

  for(
    let p=0;
    p<totalPages;
    p++
  ){

    const page =
      document.createElement(
        "section"
      );

    page.className="paper";

    const start =
      p * ROWS_PER_PAGE;

    let rows="";

    for(
      let r=0;
      r<ROWS_PER_PAGE;
      r++
    ){

      const i =
        start+r;

      if(
        i < students.length
      ){

        const st =
          students[i];

        let total=0;

        let subCells="";

        for(
          let s=0;
          s<subjects.length;
          s++
        ){

          let mark =
            st.marks[s] || "";

          mark =
            String(mark);

          if(
            mark.trim() !== "" &&
            mark.toUpperCase() !== "ABSENT" &&
            mark.toUpperCase() !== "AB"
          ){

            const n =
              Number(mark);

            if(!isNaN(n)){

              total += n;

            }

          }

          subCells += `

            <td class="col-sub">

              <input
                value="${esc(mark)}"
                oninput="
                  cellChanged(
                    ${i},
                    ${s},
                    this.value
                  )
                "
              >

            </td>

          `;

        }

        const grade =
          getGrade(total);

        rows += `

          <tr>

            <td class="col-sr">
              ${i+1}
            </td>

            <td class="col-roll">

              <input
                value="${esc(st.roll)}"
                oninput="
                  cellInfoChanged(
                    ${i},
                    'roll',
                    this.value
                  )
                "
              >

            </td>

            <td class="col-name name">

              <input
                value="${esc(st.name)}"
                oninput="
                  cellInfoChanged(
                    ${i},
                    'name',
                    this.value
                  )
                "
              >

            </td>

            ${subCells}

            <td class="col-total total">
              ${total}
            </td>

            <td class="col-grade grade">
              ${grade}
            </td>

          </tr>

        `;

      }else{

        let blanks =
          subjects
          .map(()=>`
            <td class="col-sub"></td>
          `)
          .join("");

        rows += `

          <tr>

            <td class="col-sr">
              ${i+1}
            </td>

            <td class="col-roll"></td>

            <td class="col-name"></td>

            ${blanks}

            <td class="col-total"></td>

            <td class="col-grade"></td>

          </tr>

        `;

      }

    }


    page.innerHTML=`

      <div class="header">

        <div class="h1">
          राज्य शिक्षा शोध एवं प्रशिक्षण परिषद, बिहार, पटना
        </div>

        <div class="h2">

          अंक पत्रक (Marks Folio)

          ${
            totalPages>1
            ? `[पृष्ठ ${p+1}/${totalPages}]`
            : ""
          }

        </div>

      </div>


      <div class="info">

        <div class="info-row">

          <label>
            मूल्यांकन केंद्र का नाम :-
          </label>

          <input
            class="info-input-center"
            value="${esc(details.center)}"
            oninput="
              syncHeaderInputs(
                'center',
                this.value
              )
            "
          >

          <label>जिला :-</label>

          <input
            class="info-input-district"
            value="${esc(details.district)}"
            oninput="
              syncHeaderInputs(
                'district',
                this.value
              )
            "
          >

        </div>


        <div class="info-row wide">

          <label>
            विद्यालय का नाम :-
          </label>

          <input
            class="info-input-school"
            value="${esc(details.school)}"
            oninput="
              syncHeaderInputs(
                'school',
                this.value
              )
            "
          >

        </div>


        <div class="info-row">

          <label>यू-डायस :-</label>

          <input
            class="info-input-udise"
            value="${esc(details.udise)}"
            oninput="
              syncHeaderInputs(
                'udise',
                this.value
              )
            "
          >

          <label>
            प्रखंड का नाम :-
          </label>

          <input
            class="info-input-block"
            value="${esc(details.block)}"
            oninput="
              syncHeaderInputs(
                'block',
                this.value
              )
            "
          >

        </div>


        <div class="info-row">

          <label>
            वर्ग/उप वर्ग :-
          </label>

          <input
            class="info-input-className"
            value="${esc(details.className)}"
            oninput="
              syncHeaderInputs(
                'className',
                this.value
              )
            "
          >

          <label>
            कुल पूर्णांक :-
          </label>

          <input
            class="info-input-maxMarks marks"
            value="${subjects.length * 50}"
            readonly
          >

        </div>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th class="col-sr">
                क्र०सं०
              </th>

              <th class="col-roll">
                वर्ग<br>क्रमांक
              </th>

              <th class="col-name">
                विद्यार्थियों का नाम
              </th>

              ${
                subjects.map(s=>`
                  <th class="col-sub">
                    ${esc(s)}<br>
                    <small>पूर्णांक 50</small>
                  </th>
                `).join("")
              }

              <th class="col-total">
                कुल
              </th>

              <th class="col-grade">
                ग्रेड
              </th>

            </tr>

          </thead>


          <tbody>
            ${rows}
          </tbody>


          <tfoot>

            <tr>

              <td
                colspan="${totalCols}"
                class="note-cell">

                ※ प्रत्येक विषय का पूर्णांक 50 है।
                खाली अंक को 0 माना जाएगा।
                अनुपस्थित परीक्षार्थी के कॉलम में
                ABSENT दर्ज करें।

              </td>

            </tr>

          </tfoot>

        </table>

      </div>


      <div class="signatures">

        <div class="sig">
          परीक्षक का नाम एवं हस्ताक्षर<br>
          तिथि सहित
        </div>

        <div class="sig">
          प्रधान परीक्षक का नाम एवं<br>
          हस्ताक्षर तिथि सहित
        </div>

        <div class="sig">
          मूल्यांकन निदेशक का<br>
          हस्ताक्षर एवं मुहर
        </div>

      </div>

    `;

    wrap.appendChild(page);

  }

}


/* ==========================================================
   TABLE MARK CHANGE
========================================================== */

function cellChanged(
  studentIndex,
  subjectIndex,
  value
){

  if(
    !students[studentIndex]
  ){

    return;

  }

  students[
    studentIndex
  ].marks[
    subjectIndex
  ] = value;

  renderPages();

  autoSave();

}


/* ==========================================================
   STUDENT INFO CHANGE
========================================================== */

function cellInfoChanged(
  studentIndex,
  key,
  value
){

  if(
    !students[studentIndex]
  ){

    return;

  }

  students[
    studentIndex
  ][key]=value;

  syncFormOptions();

  if(
    studentIndex === selectedStudent
  ){

    if(key==="name"){

      document.getElementById(
        "formName"
      ).value=value;

    }

    if(key==="roll"){

      document.getElementById(
        "formRoll"
      ).value=value;

    }

  }

  renderPages();

  autoSave();

}


/* ==========================================================
   STUDENT SELECT
========================================================== */

function syncFormOptions(){

  const select =
    document.getElementById(
      "studentSelect"
    );

  const previous =
    selectedStudent;

  select.innerHTML="";

  students.forEach(
    (st,i)=>{

      const option =
        document.createElement(
          "option"
        );

      option.value=i;

      option.textContent =
        `${i+1}. ${
          st.name ||
          "नया विद्यार्थी"
        }`;

      select.appendChild(
        option
      );

    }
  );

  selectedStudent =
    Math.min(
      previous,
      Math.max(
        0,
        students.length-1
      )
    );

  select.value =
    selectedStudent;

}


/* ==========================================================
   SELECT STUDENT
========================================================== */

function selectStudent(){

  selectedStudent =
    Number(
      document.getElementById(
        "studentSelect"
      ).value
    ) || 0;

  const st =
    students[selectedStudent];

  if(!st) return;

  document.getElementById(
    "formRoll"
  ).value =
    st.roll || "";

  document.getElementById(
    "formName"
  ).value =
    st.name || "";

}


/* ==========================================================
   FORM CHANGE
========================================================== */

function formChanged(){

  const st =
    students[selectedStudent];

  if(!st) return;

  st.roll =
    document.getElementById(
      "formRoll"
    ).value;

  st.name =
    document.getElementById(
      "formName"
    ).value;

  renderPages();

  syncFormOptions();

  document.getElementById(
    "studentSelect"
  ).value =
    selectedStudent;

  autoSave();

}


/* ==========================================================
   ADD STUDENT
========================================================== */

function addStudent(){

  students.push({

    roll:"",
    name:"",
    marks:
      new Array(
        subjects.length
      ).fill("")

  });

  selectedStudent =
    students.length-1;

  renderPages();

  syncFormOptions();

  document.getElementById(
    "studentSelect"
  ).value =
    selectedStudent;

  selectStudent();

  autoSave();

}


/* ==========================================================
   REMOVE STUDENT
========================================================== */

function removeStudent(){

  if(
    students.length <= 1
  ){

    alert(
      "कम से कम एक विद्यार्थी रखना आवश्यक है।"
    );

    return;

  }

  if(
    !confirm(
      "क्या अंतिम विद्यार्थी हटाना चाहते हैं?"
    )
  ){

    return;

  }

  students.pop();

  selectedStudent =
    Math.min(
      selectedStudent,
      students.length-1
    );

  renderPages();

  syncFormOptions();

  selectStudent();

  autoSave();

}


/* ==========================================================
   NEXT STUDENT
========================================================== */

function nextStudent(){

  if(
    selectedStudent <
    students.length-1
  ){

    selectedStudent++;

  }else{

    addStudent();

    return;

  }

  document.getElementById(
    "studentSelect"
  ).value =
    selectedStudent;

  selectStudent();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================================
   AUTO SAVE
========================================================== */

function autoSave(){

  localStorage.setItem(

    "deoMarksFolio_Final_v8",

    JSON.stringify({

      subjects,
      details,
      students

    })

  );

  document.getElementById(
    "saveStatus"
  ).textContent =
    "✓ Auto-saved • "+
    new Date()
    .toLocaleTimeString("hi-IN");

}


/* ==========================================================
   SAVE
========================================================== */

function saveData(){

  autoSave();

  alert(
    "डेटा सुरक्षित कर दिया गया है।"
  );

}


/* ==========================================================
   LOAD
========================================================== */

function loadData(){

  const raw =
    localStorage.getItem(
      "deoMarksFolio_Final_v8"
    );

  if(raw){

    try{

      const data =
        JSON.parse(raw);

      if(
        Array.isArray(data.subjects) &&
        data.subjects.length
      ){

        subjects =
          data.subjects;

      }

      if(data.details){

        details =
          Object.assign(
            details,
            data.details
          );

      }

      if(
        Array.isArray(
          data.students
        )
      ){

        students =
          data.students;

      }

    }catch(e){}

  }


  if(
    students.length===0
  ){

    for(
      let i=0;
      i<30;
      i++
    ){

      students.push({

        roll:"",
        name:"",
        marks:
          new Array(
            subjects.length
          ).fill("")

      });

    }

  }


  /* पुराने data में subjects कम हों तो ठीक करें */

  students.forEach(st=>{

    if(
      !Array.isArray(st.marks)
    ){

      st.marks=[];

    }

    while(
      st.marks.length <
      subjects.length
    ){

      st.marks.push("");

    }

    if(
      st.marks.length >
      subjects.length
    ){

      st.marks =
        st.marks.slice(
          0,
          subjects.length
        );

    }

  });


  renderSubjectManager();

  renderPages();

  syncFormOptions();

  selectedStudent=0;

  selectStudent();

}


/* ==========================================================
   CLEAR
========================================================== */

function clearData(){

  if(
    confirm(
      "क्या आप पूरा डेटा रीसेट करना चाहते हैं?"
    )
  ){

    localStorage.removeItem(
      "deoMarksFolio_Final_v8"
    );

    location.reload();

  }

}


/* ==========================================================
   PDF
========================================================== */

function downloadPDF(){

  const element =
    document.getElementById(
      "pagesWrap"
    );

  const opt={

    margin:0,

    filename:
      `Marks_Folio_${
        details.className ||
        "Report"
      }.pdf`,

    image:{
      type:"jpeg",
      quality:.98
    },

    html2canvas:{
      scale:2,
      useCORS:true,
      scrollY:0
    },

    jsPDF:{
      unit:"mm",
      format:"a4",
      orientation:"portrait"
    },

    pagebreak:{
      mode:[
        "css",
        "legacy"
      ]
    }

  };

  html2pdf()
    .set(opt)
    .from(element)
    .save();

}


/* ==========================================================
   MOBILE TOUCH / HORIZONTAL SCROLL
========================================================== */

const paperContainer =
  document.querySelector(
    ".paper-container"
  );

let touchStartX=0;
let touchStartY=0;

paperContainer.addEventListener(
  "touchstart",
  function(e){

    if(
      e.touches.length===1
    ){

      touchStartX =
        e.touches[0].clientX;

      touchStartY =
        e.touches[0].clientY;

    }

  },
  {passive:true}
);

paperContainer.addEventListener(
  "touchmove",
  function(e){

    if(
      e.touches.length!==1
    ) return;

    const x =
      e.touches[0].clientX;

    const y =
      e.touches[0].clientY;

    const dx =
      touchStartX-x;

    const dy =
      touchStartY-y;

    /* Horizontal swipe */

    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      paperContainer.scrollLeft +=
        dx;

    }

  },
  {passive:true}
);


/* ==========================================================
   START
========================================================== */

loadData();

checkMandatoryPopup();

updateViews();
