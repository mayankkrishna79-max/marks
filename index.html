<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d6efd">
<title>DEO Office - Marks Folio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
@page{
  size:A4 portrait;
  margin:0;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#eef1f5;
  font-family:"Nirmala UI","Mangal","Arial Unicode MS",Arial,sans-serif;
  color:#111;
}

body{
  padding:8px;
  overflow-x:hidden;
}

.app{
  max-width:1100px;
  margin:auto;
}

/* ================= TOOLBAR ================= */

.toolbar{
  background:#fff;
  border-radius:9px;
  padding:8px;
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  box-shadow:0 2px 8px #0002;
  margin-bottom:8px;
  position:sticky;
  top:0;
  z-index:100;
}

button{
  border:0;
  border-radius:6px;
  padding:8px 11px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.primary{background:#0d6efd;color:#fff}
.green{background:#198754;color:#fff}
.gray{background:#6c757d;color:#fff}
.danger{background:#dc3545;color:#fff}
.warning{background:#fd7e14;color:#fff}
.share-btn{background:#6f42c1;color:#fff}

.view-badge{
  background:#e9ecef;
  color:#333;
  padding:7px 10px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  margin-left:auto;
}

/* ================= ENTRY PANEL ================= */

.entry-panel{
  background:#fff;
  border-radius:9px;
  padding:10px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0002;
}

.entry-title{
  font-size:15px;
  font-weight:800;
  color:#0d6efd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:8px;
}

.entry-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(130px,1fr));
  gap:7px;
}

.entry-grid label{
  font-size:12px;
  font-weight:700;
  display:block;
  margin-bottom:2px;
}

.entry-grid input,
.entry-grid select{
  width:100%;
  padding:7px 8px;
  border:1px solid #ccc;
  border-radius:5px;
  font-family:inherit;
  font-size:13.5px;
  background:#fff;
}

/* ================= SUBJECT CONTROLS ================= */

.subject-toolbar{
  margin-top:9px;
  padding:8px;
  border:1px solid #ddd;
  border-radius:7px;
  background:#f8f9fa;
}

.subject-toolbar-title{
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.subject-order{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.subject-order select{
  flex:1;
  min-width:130px;
  padding:6px;
  border:1px solid #bbb;
  border-radius:5px;
  font-family:inherit;
  font-size:12px;
}

.marks-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
  gap:6px;
  margin-top:8px;
}

.mark-box{
  border:1px solid #ddd;
  border-radius:6px;
  background:#fafafa;
  padding:5px;
}

.mark-box label{
  display:block;
  font-size:11px;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mark-box input{
  width:100%;
  margin-top:3px;
  padding:6px;
  text-align:center;
  border:1px solid #bbb;
  border-radius:4px;
  font-family:inherit;
  font-size:13px;
}

.form-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.form-actions button{
  flex:1;
}

.status{
  color:#198754;
  font-size:11.5px;
  font-weight:700;
  margin-top:6px;
}

/* ================= MOBILE PAPER SCROLL ================= */

.paper-container{
  width:100%;
  overflow-x:auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scroll-behavior:smooth;
  padding:5px 0 25px;
  touch-action:pan-x pan-y;
}

.pages-wrap{
  display:flex;
  flex-direction:column;
  gap:15px;
  align-items:center;
  min-width:max-content;
}

/* ================= A4 PAPER ================= */

.paper{
  width:210mm;
  height:297mm;
  min-width:210mm;
  max-width:210mm;
  max-height:297mm;
  background:#fff;
  padding:3mm 7.5mm 2.5mm;
  box-shadow:0 2px 10px #0002;
  display:flex;
  flex-direction:column;
  box-sizing:border-box;
  overflow:hidden;
  position:relative;
  page-break-after:always;
  break-after:page;
  page-break-inside:avoid;
  break-inside:avoid;
}

/* ================= HEADER ================= */

.header{
  flex-shrink:0;
  text-align:center;
  margin-bottom:1mm;
}

.h1{
  font-size:15.5px;
  font-weight:700;
  text-decoration:underline;
  margin:0;
  line-height:1.2;
}

.h2{
  font-size:14px;
  font-weight:700;
  text-decoration:underline;
  margin-top:1px;
}

/* ================= INFORMATION ================= */

.info{
  flex-shrink:0;
  font-size:11.5px;
  line-height:1.4;
  margin-bottom:1mm;
}

.info-row{
  display:grid;
  grid-template-columns:29mm 1fr 19mm 1fr;
  gap:2mm;
  align-items:end;
}

.info-row.wide{
  grid-template-columns:29mm 1fr;
}

.info label{
  font-weight:700;
  white-space:nowrap;
}

.info input{
  width:100%;
  border:0;
  border-bottom:1px dotted #555;
  outline:0;
  font-family:inherit;
  font-size:11.5px;
  height:4.8mm;
  padding:0 1mm;
  background:transparent;
}

/* ================= TABLE ================= */

.table-wrap{
  flex-shrink:0;
  display:block;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:10px;
}

th,td{
  border:0.3mm solid #222;
  text-align:center;
  padding:0;
}

thead th{
  height:9mm;
  font-weight:700;
  vertical-align:middle;
  line-height:1.05;
  font-size:10px;
}

tbody tr{
  height:6.8mm;
  max-height:6.8mm;
}

th.col-sr,
td.col-sr{
  width:9mm;
}

th.col-roll,
td.col-roll{
  width:12mm;
}

th.col-name,
td.col-name{
  width:auto;
}

th.col-sub,
td.col-sub{
  width:13mm;
}

th.col-total,
td.col-total{
  width:13mm;
}

th.col-grade,
td.col-grade{
  width:15mm;
}

td input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  text-align:center;
  font-family:inherit;
  font-size:10.5px;
  padding:0;
}

td.name input{
  text-align:left;
  padding-left:1.5mm;
}

td.total,
td.grade{
  font-weight:700;
  font-size:10.5px;
}

/* ================= NOTE ================= */

tfoot td.note-cell{
  border:0!important;
  text-align:left;
  font-size:9.5px;
  font-weight:600;
  padding-top:1mm;
  line-height:1.15;
}

/* ================= SIGNATURE ================= */

.signatures{
  margin-top:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5mm;
  margin-bottom:1.5mm;
  font-size:10px;
  font-weight:700;
  text-align:center;
  page-break-inside:avoid;
  break-inside:avoid;
}

.sig{
  border-top:1px dashed #666;
  padding-top:8mm;
  line-height:1.25;
}

/* ================= MODAL ================= */

.dialog-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.dialog-box{
  background:#fff;
  border-radius:9px;
  padding:16px;
  width:90%;
  max-width:330px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
}

/* ================= POPUP ================= */

.popup-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:15px;
}

.popup{
  width:100%;
  max-width:350px;
  background:white;
  border-radius:14px;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.popup h3{
  margin:0 0 10px;
  font-size:19px;
}

.popup p{
  margin:0 0 18px;
  line-height:1.5;
  font-size:13.5px;
  color:#444;
}

.follow-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#25D366;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:12px;
  font-weight:800;
  font-size:15px;
  width:100%;
}

.small{
  font-size:11px;
  color:#888;
  margin-top:12px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  body{
    padding:4px;
  }

  .toolbar{
    position:sticky;
    top:0;
  }

  .toolbar button{
    flex:1 1 calc(33.33% - 5px);
    padding:8px 4px;
    font-size:11.5px;
  }

  .view-badge{
    width:100%;
    justify-content:center;
    margin-left:0;
    order:-1;
  }

  .entry-grid{
    grid-template-columns:1fr;
  }

  .entry-title{
    font-size:14px;
  }

  .paper-container{
    height:calc(100vh - 250px);
    min-height:400px;
    border:1px solid #ddd;
    border-radius:7px;
    background:#dfe3e8;
  }

  .pages-wrap{
    align-items:flex-start;
    padding:5px;
  }

  .paper{
    transform-origin:top left;
  }
}

/* ================= PRINT ================= */

@media print{

  html,body{
    background:#fff!important;
    padding:0!important;
    margin:0!important;
  }

  .toolbar,
  .entry-panel,
  .dialog-bg,
  .popup-bg{
    display:none!important;
  }

  .paper-container{
    overflow:visible!important;
    padding:0!important;
  }

  .pages-wrap{
    gap:0!important;
  }

  .paper{
    margin:0!important;
    width:210mm!important;
    min-width:210mm!important;
    height:297mm!important;
    max-height:297mm!important;
    box-shadow:none!important;
    padding:3mm 7.5mm 2.5mm!important;
    page-break-after:always!important;
    break-after:page!important;
    page-break-inside:avoid!important;
  }
}

/* ================= PDF ================= */

.pdf-mode .paper{
  box-shadow:none!important;
}
</style>
</head>

<body>

<div class="app">

<!-- TOOLBAR -->
<div class="toolbar">

<button class="primary" onclick="addStudent()">＋ विद्यार्थी</button>

<button class="danger" onclick="removeStudent()">− विद्यार्थी</button>

<button class="warning" onclick="downloadPDF()">📥 PDF</button>

<button class="gray" onclick="window.print()">🖨 Print</button>

<button class="share-btn" onclick="shareApp()">🔗 Share</button>

<button class="green" onclick="saveData()">💾 Save</button>

<button class="gray" onclick="loadData()">↻ Reload</button>

<button class="danger" onclick="clearData()">Clear</button>

<div class="view-badge">
👁️ Views: <span id="viewCount">...</span>
</div>

</div>


<!-- ENTRY PANEL -->
<div class="entry-panel">

<div class="entry-title">

<span>📝 Marks Folio Entry Panel</span>

<div style="display:flex;gap:4px;flex-wrap:wrap">

<button class="primary"
style="padding:4px 7px;font-size:11px"
onclick="addSubject()">
＋ विषय जोड़ें
</button>

<button class="danger"
style="padding:4px 7px;font-size:11px"
onclick="openSubjectModal()">
− विषय हटाएं
</button>

</div>

</div>


<div class="entry-grid">

<div>
<label>विद्यार्थी चुनें</label>
<select id="studentSelect" onchange="selectStudent()"></select>
</div>

<div>
<label>वर्ग क्रमांक</label>
<input id="formRoll" inputmode="numeric" oninput="formChanged()">
</div>

<div style="grid-column:1/-1">
<label>विद्यार्थी का नाम</label>
<input id="formName" oninput="formChanged()">
</div>

</div>


<!-- SUBJECT ORDER -->
<div class="subject-toolbar">

<div class="subject-toolbar-title">
📚 विषय व्यवस्था
</div>

<div class="subject-order" id="subjectOrder"></div>

</div>


<!-- MARKS ENTRY -->
<div class="marks-grid" id="marksGrid"></div>


<div class="form-actions">

<button class="primary" onclick="nextStudent()">
Next Student →
</button>

<button class="green" onclick="saveData()">
💾 Save
</button>

</div>

<div class="status" id="saveStatus">
✓ Auto-save चालू है
</div>

</div>


<!-- PAPER -->
<div class="paper-container" id="paperContainer">

<div class="pages-wrap" id="pagesWrap"></div>

</div>

</div>


<!-- SUBJECT DELETE MODAL -->
<div class="dialog-bg" id="subModal">

<div class="dialog-box">

<h4 style="margin:0 0 10px">
कौन सा विषय हटाना चाहते हैं?
</h4>

<select id="delSubSelect"
style="width:100%;padding:8px;border:1px solid #ccc;border-radius:5px;font-size:13px;margin-bottom:12px">
</select>

<div style="display:flex;gap:6px;justify-content:flex-end">

<button class="gray" onclick="closeSubjectModal()">
रद्द करें
</button>

<button class="danger" onclick="confirmRemoveSubject()">
हटाएं
</button>

</div>

</div>

</div>


<!-- FOLLOW POPUP -->
<div class="popup-bg" id="followPopup">

<div class="popup">

<h3>📢 DEO Office से जुड़ें</h3>

<p>
बिहार शिक्षा विभाग से जुड़े सभी जरूरी प्रपत्र,
अंक पत्रक और ताजा अपडेट पाने के लिए हमारे
WhatsApp चैनल को Follow करें।
</p>

<button class="follow-btn" onclick="handleMandatoryFollow()">

<span>📱</span>

Follow DEO Office

</button>

<div class="small">
आगे बढ़ने के लिए Follow करना अनिवार्य है।
</div>

</div>

</div>


<script>

/* =========================================================
   WHATSAPP CHANNEL
========================================================= */

const CHANNEL_LINK =
"https://whatsapp.com/channel/0029VaIhMoY35fM4YK5xrz3P";


/* =========================================================
   BASIC SETTINGS
========================================================= */

const ROWS_PER_PAGE = 30;

const MARKS_PER_SUBJECT = 50;


/* =========================================================
   DEFAULT SUBJECTS
========================================================= */

let subjects = [

"हिन्दी/राष्ट्र भाषा",

"गणित",

"अंग्रेजी",

"संस्कृत/उर्दू",

"सा० विज्ञान",

"विज्ञान"

];


/* =========================================================
   DATA
========================================================= */

let students = [];

let details = {

center:"",
district:"",
school:"",
udise:"",
block:"",
className:"",
maxMarks:"300"

};

let selectedStudent = 0;


/* =========================================================
   ESCAPE
========================================================= */

function esc(s){

return String(s ?? "")
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


/* =========================================================
   GRADE
========================================================= */

function getGrade(total){

const max =
subjects.length * MARKS_PER_SUBJECT;

if(total === 0) return "AB";

if(!max) return "";

const percentage =
(total / max) * 100;

if(percentage >= 80) return "A+";
if(percentage >= 60) return "A";
if(percentage >= 45) return "B+";
if(percentage >= 33) return "B";

return "C";

}


/* =========================================================
   TOTAL
========================================================= */

function calculateTotal(student){

let total = 0;

(student.marks || []).forEach(m => {

m = String(m ?? "").trim();

if(
m !== "" &&
m.toUpperCase() !== "ABSENT" &&
m.toUpperCase() !== "AB"
){

const n = Number(m);

if(!isNaN(n)){
total += n;
}

}

});

return total;

}


/* =========================================================
   VIEW COUNTER
========================================================= */

function updateViews(){

fetch(
"https://api.counterapi.dev/v1/deo_marks_folio_bihar/views/up"
)

.then(res => res.json())

.then(data => {

if(data && data.count){

document.getElementById("viewCount")
.textContent =
Number(data.count)
.toLocaleString("hi-IN");

}

})

.catch(() => {

let localViews =
Number(
localStorage.getItem("deo_local_views") || 1054
) + 1;

localStorage.setItem(
"deo_local_views",
localViews
);

document.getElementById("viewCount")
.textContent =
localViews.toLocaleString("hi-IN");

});

}


/* =========================================================
   SHARE
========================================================= */

function shareApp(){

const shareData = {

title:"DEO Office - Marks Folio Maker",

text:
"बिहार विद्यालय अंक पत्रक (Marks Folio) ऑनलाइन भरें और A4 PDF डाउनलोड करें:",

url:window.location.href

};

if(navigator.share){

navigator.share(shareData).catch(()=>{});

}else{

navigator.clipboard
.writeText(window.location.href)
.then(()=>{

alert(
"📋 लिंक कॉपी हो गया है। अब WhatsApp पर शेयर कर सकते हैं।"
);

})

.catch(()=>{

window.open(
"https://api.whatsapp.com/send?text="+
encodeURIComponent(
shareData.text+" "+shareData.url
),
"_blank"
);

});

}

}


/* =========================================================
   FOLLOW POPUP
========================================================= */

function checkMandatoryPopup(){

if(
localStorage.getItem(
"deoFollowCompleted_v4"
)!=="1"
){

document.getElementById(
"followPopup"
).style.display="flex";

}

}


function handleMandatoryFollow(){

window.open(CHANNEL_LINK,"_blank");

localStorage.setItem(
"deoFollowCompleted_v4",
"1"
);

document.getElementById(
"followPopup"
).style.display="none";

}


/* =========================================================
   SUBJECT CONTROLS
========================================================= */

function renderSubjectControls(){

renderMarksGrid();

renderSubjectOrder();

}


/* =========================================================
   MARKS ENTRY BOX
========================================================= */

function renderMarksGrid(){

const grid =
document.getElementById("marksGrid");

grid.innerHTML =
subjects.map((sub,i)=>{

return `

<div class="mark-box">

<label title="${esc(sub)}">
${esc(sub)}
</label>

<input
id="m${i}"
inputmode="numeric"
placeholder="0 / ABSENT"
oninput="formChanged()"
>

</div>

`;

}).join("");

}


/* =========================================================
   SUBJECT ORDER DROPDOWN
========================================================= */

function renderSubjectOrder(){

const container =
document.getElementById("subjectOrder");

container.innerHTML = "";

subjects.forEach((sub,i)=>{

const select =
document.createElement("select");

select.innerHTML = subjects
.map((s,j)=>`
<option value="${j}">
${j+1}. ${esc(s)}
</option>
`)
.join("");

select.value = i;

select.title =
`${i+1}. ${sub} का क्रम बदलें`;

select.onchange = function(){

moveSubject(i,Number(this.value));

};

container.appendChild(select);

});

}


/* =========================================================
   MOVE SUBJECT
========================================================= */

function moveSubject(from,to){

if(from===to) return;

if(
from<0 ||
to<0 ||
from>=subjects.length ||
to>=subjects.length
) return;


/* Move subject name */

const subject =
subjects.splice(from,1)[0];

subjects.splice(to,0,subject);


/* Move corresponding marks */

students.forEach(student=>{

const mark =
student.marks.splice(from,1)[0];

student.marks.splice(to,0,mark);

});


renderSubjectControls();

renderPages();

selectStudent();

autoSave();

}


/* =========================================================
   ADD SUBJECT
========================================================= */

function addSubject(){

const name =
prompt(
"नए विषय का नाम दर्ज करें:",
`विषय ${subjects.length+1}`
);

if(!name || !name.trim()) return;

subjects.push(name.trim());

students.forEach(student=>{

while(
student.marks.length < subjects.length
){

student.marks.push("");

}

});

details.maxMarks =
String(subjects.length * MARKS_PER_SUBJECT);

renderSubjectControls();

renderPages();

selectStudent();

autoSave();

}


/* =========================================================
   DELETE SUBJECT MODAL
========================================================= */

function openSubjectModal(){

if(subjects.length<=1){

alert(
"कम से कम एक विषय होना अनिवार्य है!"
);

return;

}

const select =
document.getElementById("delSubSelect");

select.innerHTML =
subjects.map((s,i)=>`

<option value="${i}">
${i+1}. ${esc(s)}
</option>

`).join("");

document.getElementById(
"subModal"
).style.display="flex";

}


function closeSubjectModal(){

document.getElementById(
"subModal"
).style.display="none";

}


/* =========================================================
   CONFIRM DELETE SUBJECT
========================================================= */

function confirmRemoveSubject(){

const select =
document.getElementById("delSubSelect");

const idx =
Number(select.value);

if(
isNaN(idx) ||
idx<0 ||
idx>=subjects.length
) return;


/* Remove subject */

subjects.splice(idx,1);


/* Remove corresponding marks */

students.forEach(student=>{

if(Array.isArray(student.marks)){

student.marks.splice(idx,1);

}

});


details.maxMarks =
String(subjects.length * MARKS_PER_SUBJECT);

closeSubjectModal();

renderSubjectControls();

renderPages();

selectStudent();

autoSave();

}

/* =========================================================
   CELL MARK CHANGE
========================================================= */

function cellChanged(stIdx,subIdx,val){

if(!students[stIdx]) return;

if(!Array.isArray(students[stIdx].marks))
students[stIdx].marks=[];

students[stIdx].marks[subIdx]=val;


/* Update entry box */

if(stIdx===selectedStudent){

const input =
document.getElementById("m"+subIdx);

if(input)
input.value=val;

}


renderPages();

autoSave();

}


/* =========================================================
   STUDENT INFO CHANGE
========================================================= */

function cellInfoChanged(stIdx,key,val){

if(!students[stIdx]) return;

students[stIdx][key]=val;


if(stIdx===selectedStudent){

if(key==="name")
document.getElementById("formName").value=val;

if(key==="roll")
document.getElementById("formRoll").value=val;

}


syncFormOptions();

autoSave();

}


/* =========================================================
   FORM OPTIONS
========================================================= */

function syncFormOptions(){

const previous=selectedStudent;

const select =
document.getElementById("studentSelect");

select.innerHTML="";


students.forEach((student,i)=>{

const opt =
document.createElement("option");

opt.value=i;

opt.textContent =
`${i+1}. ${student.name || "नया विद्यार्थी"}`;

select.appendChild(opt);

});


selectedStudent =
Math.min(
previous,
Math.max(0,students.length-1)
);

select.value=selectedStudent;

}


/* =========================================================
   SELECT STUDENT
========================================================= */

function selectStudent(){

selectedStudent =
Number(
document.getElementById("studentSelect").value
) || 0;

const student =
students[selectedStudent];

if(!student) return;


document.getElementById("formRoll").value =
student.roll || "";

document.getElementById("formName").value =
student.name || "";


for(let i=0;i<subjects.length;i++){

const input =
document.getElementById("m"+i);

if(input){

input.value =
student.marks?.[i] ?? "";

}

}

}


/* =========================================================
   FORM CHANGE
========================================================= */

function formChanged(){

const student =
students[selectedStudent];

if(!student) return;


student.roll =
document.getElementById("formRoll").value;

student.name =
document.getElementById("formName").value;


if(!Array.isArray(student.marks))
student.marks=[];


for(let i=0;i<subjects.length;i++){

const input =
document.getElementById("m"+i);

student.marks[i] =
input ? input.value : "";

}


renderPages();

syncFormOptions();

document.getElementById(
"studentSelect"
).value=selectedStudent;

autoSave();

}


/* =========================================================
   ADD STUDENT
========================================================= */

function addStudent(){

students.push({

roll:"",
name:"",
marks:new Array(
subjects.length
).fill("")

});


selectedStudent =
students.length-1;

renderPages();

syncFormOptions();

document.getElementById(
"studentSelect"
).value=selectedStudent;

selectStudent();

autoSave();

}


/* =========================================================
   DELETE LAST STUDENT
========================================================= */

function removeStudent(){

if(students.length<=1){

alert(
"कम से कम एक विद्यार्थी रखना आवश्यक है।"
);

return;

}

if(
!confirm(
"क्या अंतिम विद्यार्थी हटाना चाहते हैं?"
)
) return;


students.pop();

selectedStudent =
Math.min(
selectedStudent,
students.length-1
);

renderPages();

syncFormOptions();

document.getElementById(
"studentSelect"
).value=selectedStudent;

selectStudent();

autoSave();

}


/* =========================================================
   NEXT STUDENT
========================================================= */

function nextStudent(){

if(
selectedStudent <
students.length-1
){

selectedStudent++;

}else{

addStudent();

return;

}


document.getElementById(
"studentSelect"
).value=selectedStudent;

selectStudent();


window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* =========================================================
   AUTO SAVE
========================================================= */

function autoSave(){

localStorage.setItem(

"deoMarksFolio_Final_v8",

JSON.stringify({

subjects,
details,
students

})

);


const status =
document.getElementById("saveStatus");

if(status){

status.textContent =
"✓ Auto-saved • "+
new Date()
.toLocaleTimeString("hi-IN");

}

}


/* =========================================================
   SAVE
========================================================= */

function saveData(){

autoSave();

alert(
"डेटा सुरक्षित कर दिया गया है।"
);

}


/* =========================================================
   LOAD
========================================================= */

function loadData(){

const raw =
localStorage.getItem(
"deoMarksFolio_Final_v8"
);


if(raw){

try{

const data =
JSON.parse(raw);


if(
Array.isArray(data.subjects) &&
data.subjects.length
){

subjects=data.subjects;

}


if(data.details){

details =
Object.assign(
details,
data.details
);

}


if(
Array.isArray(data.students)
){

students=data.students;

}

}catch(e){

console.log(e);

}

}


/* Repair student marks */

students.forEach(student=>{

if(!Array.isArray(student.marks))
student.marks=[];

while(
student.marks.length<subjects.length
){

student.marks.push("");

}

student.marks =
student.marks.slice(
0,
subjects.length
);

});


if(students.length===0){

for(
let i=0;
i<30;
i++
){

students.push({

roll:"",
name:"",
marks:new Array(
subjects.length
).fill("")

});

}

}


details.maxMarks =
String(
subjects.length *
MARKS_PER_SUBJECT
);


renderSubjectControls();

renderPages();

syncFormOptions();

selectedStudent=0;

selectStudent();

}


/* =========================================================
   CLEAR
========================================================= */

function clearData(){

if(
!confirm(
"क्या आप पूरा डेटा रीसेट करना चाहते हैं?"
)
) return;


localStorage.removeItem(
"deoMarksFolio_Final_v8"
);

location.reload();

}


/* =========================================================

========================================================= */

function downloadPDF(){

const element =
document.getElementById("pagesWrap");


element.classList.add("pdf-mode");


const opt={

margin:0,

filename:
`Marks_Folio_${details.className || "Report"}.pdf`,

image:{
type:"jpeg",
quality:0.98
},

html2canvas:{

scale:2,

useCORS:true,

scrollY:0,

backgroundColor:"#ffffff"

},

jsPDF:{

unit:"mm",

format:"a4",

orientation:"portrait"

},

pagebreak:{
mode:["css","legacy"]
}

};


html2pdf()

.set(opt)

.from(element)

.save()

.then(()=>{

element.classList.remove(
"pdf-mode"
);

});

}

/* =========================================================
   MOBILE HORIZONTAL SCROLL SUPPORT
========================================================= */

const paperContainer =
document.getElementById("paperContainer");


let startX=0;
let startY=0;


paperContainer.addEventListener(
"touchstart",
function(e){

if(e.touches.length!==1)
return;

startX=e.touches[0].clientX;
startY=e.touches[0].clientY;

},
{passive:true}
);


paperContainer.addEventListener(
"touchmove",
function(e){

if(e.touches.length!==1)
return;

const dx =
e.touches[0].clientX-startX;

const dy =
e.touches[0].clientY-startY;


/*
   Browser को horizontal और vertical
   दोनों scrolling naturally करने दें।
*/

if(Math.abs(dx)>Math.abs(dy)){

e.preventDefault();

paperContainer.scrollLeft -= dx;

startX=e.touches[0].clientX;

}

},
{passive:false}
);

</script>
