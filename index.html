<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#0d6efd">
<title>DEO Office - Marks Folio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
@page{
  size:A4 portrait;
  margin:0;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#eef1f5;
  color:#111;
  font-family:"Nirmala UI","Mangal","Arial Unicode MS",Arial,sans-serif;
}

body{
  padding:8px;
  overflow-x:hidden;
}

.app{
  max-width:1100px;
  margin:auto;
}

/* ================= TOOLBAR ================= */

.toolbar{
  background:#fff;
  border-radius:8px;
  padding:8px;
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  box-shadow:0 2px 8px #0002;
  margin-bottom:8px;
  position:sticky;
  top:0;
  z-index:100;
}

button{
  border:0;
  border-radius:6px;
  padding:7px 11px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.primary{background:#0d6efd;color:#fff}
.green{background:#198754;color:#fff}
.gray{background:#6c757d;color:#fff}
.danger{background:#dc3545;color:#fff}
.warning{background:#fd7e14;color:#fff}
.share-btn{background:#6f42c1;color:#fff}

.view-badge{
  background:#e9ecef;
  color:#333;
  padding:6px 10px;
  border-radius:6px;
  font-size:12.5px;
  font-weight:700;
  margin-left:auto;
}

/* ================= ENTRY PANEL ================= */

.entry-panel{
  background:#fff;
  border-radius:8px;
  padding:10px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0002;
}

.entry-title{
  font-size:15.5px;
  font-weight:800;
  margin-bottom:8px;
  color:#0d6efd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}

.entry-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:6px;
}

.entry-grid label{
  font-size:12px;
  font-weight:700;
  margin-bottom:2px;
  display:block;
}

.entry-grid input,
.entry-grid select{
  width:100%;
  padding:6px 8px;
  border:1px solid #ccc;
  border-radius:5px;
  font-family:inherit;
  font-size:13.5px;
  background:#fff;
}

.subject-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(85px,1fr));
  gap:5px;
  margin-top:8px;
}

.subject-box{
  border:1px solid #ddd;
  border-radius:5px;
  padding:4px;
  background:#fafafa;
}

.subject-box input.sub-name{
  border:0;
  border-bottom:1px dashed #888;
  border-radius:0;
  background:transparent;
  font-weight:700;
  font-size:11.5px;
  text-align:center;
  padding:2px 0;
  margin-bottom:3px;
  width:100%;
}

.subject-box input.sub-marks{
  width:100%;
  padding:5px;
  border:1px solid #bbb;
  border-radius:4px;
  font-size:13.5px;
  text-align:center;
  background:#fff;
}

.status{
  font-size:11.5px;
  color:#198754;
  font-weight:700;
  margin-top:6px;
}

.form-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.form-actions button{
  flex:1;
  padding:8px;
}

/* ================= MOBILE PAPER VIEW ================= */

.paper-container{
  width:100%;
  overflow-x:auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  overscroll-behavior-y:auto;
  touch-action:pan-x pan-y;
  padding:8px 4px 25px;
  scroll-behavior:smooth;
}

.paper-container::-webkit-scrollbar{
  height:12px;
  width:12px;
}

.paper-container::-webkit-scrollbar-thumb{
  background:#777;
  border-radius:10px;
}

.paper-container::-webkit-scrollbar-track{
  background:#ddd;
}

.pages-wrap{
  display:flex;
  flex-direction:column;
  gap:15px;
  align-items:center;
}

/* ================= A4 PAPER ================= */

.paper{
  width:210mm;
  min-width:210mm;
  height:297mm;
  max-height:297mm;
  background:#fff;

  padding:3mm 7.5mm 2.5mm;

  box-shadow:0 2px 10px #0002;

  display:flex;
  flex-direction:column;

  overflow:hidden;
  position:relative;

  page-break-after:always;
  page-break-inside:avoid;
  break-after:page;
  break-inside:avoid;
}

/* ================= HEADER ================= */

.header{
  flex-shrink:0;
  text-align:center;
  margin-bottom:.8mm;
}

.h1{
  font-size:15.5px;
  font-weight:700;
  text-decoration:underline;
  margin:0;
  line-height:1.2;
}

.h2{
  font-size:14px;
  font-weight:700;
  text-decoration:underline;
  margin-top:1px;
}

/* ================= INFO ================= */

.info{
  flex-shrink:0;
  font-size:11.5px;
  line-height:1.4;
  margin-bottom:1mm;
}

.info-row{
  display:grid;
  grid-template-columns:29mm 1fr 19mm 1fr;
  gap:2mm;
  align-items:end;
}

.info-row.wide{
  grid-template-columns:29mm 1fr;
}

.info label{
  font-weight:700;
  white-space:nowrap;
}

.info input{
  width:100%;
  border:0;
  border-bottom:1px dotted #555;
  outline:0;
  font-family:inherit;
  font-size:11.5px;
  height:4.8mm;
  padding:0 1mm;
  background:transparent;
}

/* ================= MARKS SUMMARY ================= */

.subject-summary{
  display:flex;
  flex-wrap:wrap;
  gap:3mm;
  font-size:10px;
  font-weight:700;
  margin-bottom:1.5mm;
}

.summary-item{
  border:1px solid #555;
  padding:1mm 2mm;
}

/* ================= TABLE ================= */

.table-wrap{
  flex-shrink:0;
  display:block;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:10.5px;
}

th,td{
  border:.3mm solid #222;
  text-align:center;
  padding:0;
}

thead th{
  height:8mm;
  font-weight:700;
  vertical-align:middle;
  line-height:1.1;
  font-size:10.5px;
}

tbody tr{
  height:7.2mm;
  max-height:7.2mm;
}

th.col-sr,
td.col-sr{
  width:9mm;
}

th.col-roll,
td.col-roll{
  width:11.5mm;
}

th.col-name,
td.col-name{
  width:42mm;
}

th.col-sub,
td.col-sub{
  width:13mm;
}

th.col-total,
td.col-total{
  width:13mm;
}

th.col-grade,
td.col-grade{
  width:14mm;
}

td input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  text-align:center;
  font-family:inherit;
  font-size:10.5px;
  padding:0;
}

td.name input{
  text-align:left;
  padding-left:1.5mm;
  font-size:10.5px;
}

td.total{
  font-weight:700;
  font-size:10.5px;
}

td.grade{
  font-weight:700;
}

/* ================= NOTE ================= */

tfoot td.note-cell{
  border:0!important;
  text-align:left;
  font-size:9.5px;
  font-weight:600;
  padding-top:1mm;
  padding-bottom:.5mm;
  line-height:1.15;
}

/* ================= SIGNATURE ================= */

.signatures{
  margin-top:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5mm;
  margin-bottom:1.5mm;
  font-size:10.5px;
  font-weight:700;
  text-align:center;
  page-break-inside:avoid;
  break-inside:avoid;
}

.sig{
  border-top:1px dashed #666;
  padding-top:9mm;
  line-height:1.25;
}

/* ================= MODAL ================= */

.dialog-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
}

.dialog-box{
  background:#fff;
  border-radius:8px;
  padding:16px;
  width:90%;
  max-width:350px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.subject-list{
  max-height:300px;
  overflow-y:auto;
}

.subject-row{
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px;
  border:1px solid #ddd;
  margin-bottom:5px;
  border-radius:5px;
  background:#fafafa;
}

.subject-row span{
  flex:1;
  font-weight:700;
}

.subject-row button{
  padding:4px 7px;
}

/* ================= FOLLOW POPUP ================= */

.popup-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:15px;
}

.popup{
  width:100%;
  max-width:350px;
  background:white;
  border-radius:14px;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.popup h3{
  margin:0 0 10px;
  font-size:19px;
}

.popup p{
  margin:0 0 18px;
  line-height:1.5;
  font-size:13.5px;
  color:#444;
}

.follow-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#25D366;
  color:white;
  border:0;
  border-radius:8px;
  padding:12px;
  font-weight:800;
  font-size:15px;
  width:100%;
}

.small{
  font-size:11px;
  color:#888;
  margin-top:12px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  body{
    padding:4px;
  }

  .toolbar{
    position:sticky;
    top:0;
  }

  .toolbar button{
    flex:1 1 calc(33% - 5px);
    padding:8px 4px;
    font-size:12px;
  }

  .view-badge{
    width:100%;
    justify-content:center;
    margin-left:0;
    order:-1;
    margin-bottom:4px;
  }

  .paper-container{
    height:calc(100vh - 245px);
    min-height:400px;
    overflow-x:auto;
    overflow-y:auto;
  }

  .pages-wrap{
    width:max-content;
    align-items:flex-start;
  }

  .paper{
    margin-left:0;
    margin-right:0;
  }

}

/* ================= PRINT ================= */

@media print{

  html,body{
    background:#fff!important;
    padding:0!important;
    margin:0!important;
  }

  .toolbar,
  .entry-panel,
  .dialog-bg,
  .popup-bg{
    display:none!important;
  }

  .paper-container{
    overflow:visible!important;
    padding:0!important;
  }

  .pages-wrap{
    gap:0!important;
  }

  .paper{
    margin:0!important;
    width:210mm!important;
    min-width:210mm!important;
    height:297mm!important;
    max-height:297mm!important;
    box-shadow:none!important;
    padding:3mm 7.5mm 2.5mm!important;
    page-break-after:always!important;
    page-break-inside:avoid!important;
    break-after:page!important;
    break-inside:avoid!important;
  }

  input{
    color:#000!important;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= TOOLBAR ================= -->

<div class="toolbar">

<button class="primary" onclick="addStudent()">＋ विद्यार्थी</button>

<button class="danger" onclick="removeStudent()">— अंतिम विद्यार्थी</button>

<button class="warning" onclick="downloadPDF()">📥 PDF</button>

<button class="gray" onclick="window.print()">🖨 Print</button>

<button class="share-btn" onclick="shareApp()">🔗 Share</button>

<button class="green" onclick="saveData()">💾 Save</button>

<button class="gray" onclick="loadData()">↻ Reload</button>

<button class="danger" onclick="clearData()">Clear</button>

<div class="view-badge">
👁️ Views: <span id="viewCount">...</span>
</div>

</div>


<!-- ================= ENTRY PANEL ================= -->

<div class="entry-panel">

<div class="entry-title">

<span>📝 Marks Folio Entry Panel</span>

<div style="display:flex;gap:4px;flex-wrap:wrap">

<button
class="primary"
style="padding:3px 7px;font-size:11.5px"
onclick="addSubject()">
＋ विषय
</button>

<button
class="gray"
style="padding:3px 7px;font-size:11.5px"
onclick="openArrangeModal()">
↕ विषय व्यवस्थित करें
</button>

</div>

</div>


<div class="entry-grid">

<div>

<label>विद्यार्थी चुनें</label>

<select id="studentSelect" onchange="selectStudent()"></select>

</div>


<div>

<label>वर्ग क्रमांक</label>

<input
id="formRoll"
inputmode="numeric"
oninput="formChanged()">

</div>


<div style="grid-column:1/-1">

<label>विद्यार्थी का नाम</label>

<input
id="formName"
oninput="formChanged()">

</div>

</div>


<div class="subject-grid" id="subjectGrid"></div>


<div class="form-actions">

<button
class="primary"
onclick="nextStudent()">
Next Student →
</button>

<button
class="green"
onclick="saveData()">
💾 Save
</button>

</div>


<div
class="status"
id="saveStatus">
✓ Auto-save चालू है
</div>

</div>


<!-- ================= PAPER ================= -->

<div class="paper-container" id="paperContainer">

<div class="pages-wrap" id="pagesWrap"></div>

</div>

</div>


<!-- ================= SUBJECT ARRANGE MODAL ================= -->

<div class="dialog-bg" id="arrangeModal">

<div class="dialog-box">

<h4 style="margin:0 0 10px">
विषयों का क्रम व्यवस्थित करें
</h4>

<div
class="subject-list"
id="subjectArrangeList">
</div>

<div
style="display:flex;justify-content:flex-end;margin-top:10px">

<button
class="gray"
onclick="closeArrangeModal()">
बंद करें
</button>

</div>

</div>

</div>


<!-- ================= FOLLOW POPUP ================= -->

<div class="popup-bg" id="followPopup">

<div class="popup">

<h3>📢 DEO Office से जुड़ें</h3>

<p>
बिहार शिक्षा विभाग से जुड़े सभी जरूरी प्रपत्र,
अंक पत्रक और ताजा अपडेट पाने के लिए हमारे
WhatsApp चैनल को Follow करें।
</p>

<button
class="follow-btn"
onclick="handleMandatoryFollow()">

📱 Follow DEO Office

</button>

<div class="small">
आगे बढ़ने के लिए Follow करना अनिवार्य है।
</div>

</div>

</div>


<script>

/* =====================================================
   WHATSAPP CHANNEL
===================================================== */

const CHANNEL_LINK =
"https://whatsapp.com/channel/0029VaIhMoY35fM4YK5xrz3P";


/* =====================================================
   SETTINGS
===================================================== */

const ROWS_PER_PAGE = 30;


/* =====================================================
   SUBJECTS
===================================================== */

let subjects = [

"हिन्दी/राष्ट्र भाषा",

"गणित",

"अंग्रेजी",

"संस्कृत/उर्दू",

"सा० विज्ञान",

"विज्ञान"

];


/* =====================================================
   DATA
===================================================== */

let students = [];

let details = {

center:"",
district:"",
school:"",
udise:"",
block:"",
className:"",
maxMarks:"50"

};

let selectedStudent = 0;


/* =====================================================
   ESCAPE
===================================================== */

function esc(s){

return String(s || "")
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


/* =====================================================
   GRADE
=====================================================

   0 = F
   1-32% = F
   33-44 = D
   45-59 = C
   60-74 = B
   75-89 = A
   90-100 = A+
===================================================== */

function getGrade(total){

const max =
subjects.length * 50;

if(!total || total <= 0)
return "F";

const percent =
(total / max) * 100;

if(percent >= 90)
return "A+";

if(percent >= 75)
return "A";

if(percent >= 60)
return "B";

if(percent >= 45)
return "C";

if(percent >= 33)
return "D";

return "F";

}


/* =====================================================
   VIEW COUNTER
===================================================== */

function updateViews(){

fetch(
'https://api.counterapi.dev/v1/deo_marks_folio_bihar/views/up'
)

.then(res=>res.json())

.then(data=>{

if(data && data.count){

document.getElementById("viewCount")
.textContent =
Number(data.count)
.toLocaleString("hi-IN");

}

})

.catch(()=>{

let localViews =
Number(
localStorage.getItem("deo_local_views") || 1054
) + 1;

localStorage.setItem(
"deo_local_views",
localViews
);

document.getElementById("viewCount")
.textContent =
localViews.toLocaleString("hi-IN");

});

}


/* =====================================================
   SHARE
===================================================== */

function shareApp(){

const shareData = {

title:"DEO Office - Marks Folio Maker",

text:
"बिहार विद्यालय अंक पत्रक (Marks Folio) ऑनलाइन भरें और A4 PDF डाउनलोड करें:",

url:window.location.href

};

if(navigator.share){

navigator.share(shareData).catch(()=>{});

}

else{

navigator.clipboard
.writeText(window.location.href)
.then(()=>{

alert(
"📋 लिंक क्लिपबोर्ड पर कॉपी हो गया है!"
);

})
.catch(()=>{

window.open(
`https://api.whatsapp.com/send?text=${
encodeURIComponent(
shareData.text+" "+shareData.url
)
}`,
"_blank"
);

});

}

}


/* =====================================================
   FOLLOW POPUP
===================================================== */

function checkMandatoryPopup(){

if(
localStorage.getItem(
"deoFollowCompleted_v4"
)!=="1"
){

document.getElementById(
"followPopup"
).style.display="flex";

}

}


function handleMandatoryFollow(){

window.open(CHANNEL_LINK,"_blank");

localStorage.setItem(
"deoFollowCompleted_v4",
"1"
);

document.getElementById(
"followPopup"
).style.display="none";

}


/* =====================================================
   SUBJECT CONTROLS
===================================================== */

function renderSubjectControls(){

const grid =
document.getElementById("subjectGrid");

grid.innerHTML =
subjects.map((sub,i)=>`

<div class="subject-box">

<input
class="sub-name"
value="${esc(sub)}"
title="विषय का नाम बदलें"
oninput="updateSubjectName(${i},this.value)">

<input
class="sub-marks"
id="m${i}"
inputmode="numeric"
placeholder="0 / AB"
oninput="formChanged()">

</div>

`).join("");

}


/* =====================================================
   ADD SUBJECT
===================================================== */

function addSubject(){

const name =
prompt(
"नए विषय का नाम दर्ज करें:",
`विषय ${subjects.length+1}`
);

if(name && name.trim()){

subjects.push(name.trim());

students.forEach(s=>{

while(
s.marks.length < subjects.length
){

s.marks.push("");

}

});

renderSubjectControls();

renderPages();

selectStudent();

autoSave();

}

}


/* =====================================================
   ARRANGE SUBJECTS
===================================================== */

function openArrangeModal(){

const list =
document.getElementById(
"subjectArrangeList"
);

list.innerHTML =
subjects.map((s,i)=>`

<div class="subject-row">

<span>
${i+1}. ${esc(s)}
</span>

<button
class="gray"
onclick="moveSubject(${i},-1)">
↑
</button>

<button
class="gray"
onclick="moveSubject(${i},1)">
↓
</button>

<button
class="danger"
onclick="deleteSubject(${i})">
×
</button>

</div>

`).join("");

document.getElementById(
"arrangeModal"
).style.display="flex";

}


function closeArrangeModal(){

document.getElementById(
"arrangeModal"
).style.display="none";

}


function moveSubject(index,direction){

const newIndex =
index + direction;

if(
newIndex < 0 ||
newIndex >= subjects.length
){

return;

}


/* Swap subject names */

[
subjects[index],
subjects[newIndex]
]=[
subjects[newIndex],
subjects[index]
];


/* Swap marks */

students.forEach(s=>{

[
s.marks[index],
s.marks[newIndex]
]=[
s.marks[newIndex],
s.marks[index]
];

});


openArrangeModal();

renderSubjectControls();

renderPages();

selectStudent();

autoSave();

}


/* =====================================================
   DELETE SUBJECT
===================================================== */

function deleteSubject(index){

if(subjects.length <= 1){

alert(
"कम से कम एक विषय होना अनिवार्य है!"
);

return;

}

if(
!confirm(
`"${subjects[index]}" विषय हटाएं?`
)
){

return;

}

subjects.splice(index,1);

students.forEach(s=>{

s.marks.splice(index,1);

});

renderSubjectControls();

renderPages();

selectStudent();

openArrangeModal();

autoSave();

}


/* =====================================================
   HEADER SYNC
===================================================== */

function syncHeaderInputs(key,value){

details[key]=value;

document
.querySelectorAll(
`.info-input-${key}`
)
.forEach(el=>{

if(el.value!==value)
el.value=value;

});

autoSave();

}


/* =====================================================

===================================================== */

function renderPages(){

const wrap =
document.getElementById("pagesWrap");

wrap.innerHTML="";


const totalPages =
Math.max(
1,
Math.ceil(
students.length /
ROWS_PER_PAGE
)
);


for(
let p=0;
p<totalPages;
p++
){

const pageDiv =
document.createElement("section");

pageDiv.className="paper";

p*ROWS_PER_PAGE;

let r=0;
r<ROWS_PER_PAGE;
r++

const i =
startIdx+r;

const st =
students[i];


let subCells="";

let total=0;


/* ================= SUBJECT MARKS ================= */

for(
let s=0;
s<subjects.length;
s++
){

const m =
(st.marks[s] || "")
.trim();


/*

*/

if(
m !== "" &&
m.toUpperCase() !== "AB" &&
m.toUpperCase() !== "ABSENT"
){

const num =
Number(m);

if(!isNaN(num)){

total += num;

}

}


subCells += `

<td class="col-sub">

<input
value="${esc(m)}"
oninput="
cellChanged(
${i},
${s},
this.value
)
">

</td>

}


const grade =
getGrade(total);


rowsHtml += `

<tr>

<td class="col-sr">
${i+1}
</td>

<input
value="${esc(st.roll)}"
oninput="
cellInfoChanged(
${i},
'roll',
this.value
)
">

</td>

<td class="col-name name">

<input
value="${esc(st.name)}"
oninput="
cellInfoChanged(
${i},
'name',
this.value
)
">

</td>

${subCells}

<td class="col-total total">
${total}
</td>

<td class="col-grade grade">
${grade}
</td>

</tr>

`;

}

else{

const blankSub =
subjects
.map(()=>
`<td class="col-sub"></td>`
)
.join("");


rowsHtml += `

<tr>

<td class="col-sr">
${i+1}
</td>

<td class="col-roll"></td>

<td class="col-name"></td>

${blankSub}

<td class="col-total"></td>

<td class="col-grade"></td>

}

}

/* =====================================================
   CELL CHANGE
===================================================== */

function cellChanged(
stIdx,
subIdx,
val
){

students[stIdx]
.marks[subIdx]=val;


if(
stIdx===selectedStudent
){

const input =
document.getElementById(
"m"+subIdx
);

if(input)
input.value=val;

}

renderPages();

autoSave();

}


/* =====================================================
   STUDENT INFO CHANGE
===================================================== */

function cellInfoChanged(
stIdx,
key,
val
){

students[stIdx][key]=val;


if(
stIdx===selectedStudent
){

if(key==="name")
document.getElementById(
"formName"
).value=val;

if(key==="roll")
document.getElementById(
"formRoll"
).value=val;

}

syncFormOptions();

autoSave();

}


/* =====================================================
   SELECT OPTIONS
===================================================== */

function syncFormOptions(){

const previous =
selectedStudent;

const select =
document.getElementById(
"studentSelect"
);

select.innerHTML="";


students.forEach((r,i)=>{

const opt =
document.createElement(
"option"
);

opt.value=i;

opt.textContent =
`${i+1}. ${
r.name || "नया विद्यार्थी"
}`;

select.appendChild(opt);

});


selectedStudent =
Math.min(
previous,
Math.max(
0,
students.length-1
)
);

select.value =
selectedStudent;

}


/* =====================================================
   SELECT STUDENT
===================================================== */

function selectStudent(){

selectedStudent =
Number(
document.getElementById(
"studentSelect"
).value
) || 0;


const st =
students[selectedStudent];

if(!st)
return;


document.getElementById(
"formRoll"
).value =
st.roll || "";


document.getElementById(
"formName"
).value =
st.name || "";


for(
let i=0;
i<subjects.length;
i++
){

const input =
document.getElementById(
"m"+i
);

if(input)
input.value =
st.marks[i] || "";

}

}


/* =====================================================
   FORM CHANGE
===================================================== */

function formChanged(){

const st =
students[selectedStudent];

if(!st)
return;


st.roll =
document.getElementById(
"formRoll"
).value;


st.name =
document.getElementById(
"formName"
).value;


for(
let i=0;
i<subjects.length;
i++
){

const input =
document.getElementById(
"m"+i
);

st.marks[i] =
input ? input.value : "";

}


renderPages();

syncFormOptions();

document.getElementById(
"studentSelect"
).value =
selectedStudent;

autoSave();

}


/* =====================================================
   ADD STUDENT
===================================================== */

function addStudent(){

students.push({

roll:"",
name:"",
marks:
new Array(
subjects.length
).fill("")

});


renderPages();

syncFormOptions();

selectedStudent =
students.length-1;

document.getElementById(
"studentSelect"
).value =
selectedStudent;

selectStudent();

autoSave();

}


/* =====================================================
   REMOVE LAST STUDENT
===================================================== */

function removeStudent(){

if(students.length<=1){

alert(
"कम से कम एक विद्यार्थी होना चाहिए।"
);

return;

}


if(
!confirm(
"क्या अंतिम विद्यार्थी हटाना चाहते हैं?"
)
){

return;

}


students.pop();

selectedStudent =
Math.min(
selectedStudent,
students.length-1
);

renderPages();

syncFormOptions();

selectStudent();

autoSave();

}


/* =====================================================
   NEXT STUDENT
===================================================== */

function nextStudent(){

if(
selectedStudent <
students.length-1
){

selectedStudent++;

document.getElementById(
"studentSelect"
).value =
selectedStudent;

selectStudent();

}

else{

addStudent();

}


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   AUTO SAVE
===================================================== */

function autoSave(){

localStorage.setItem(

"deoMarksFolio_Final_v8",

JSON.stringify({

subjects,
details,
students

})

);


document.getElementById(
"saveStatus"
).textContent =
"✓ Auto-saved • "+
new Date()
.toLocaleTimeString("hi-IN");

}


/* =====================================================
   SAVE
===================================================== */

function saveData(){

autoSave();

alert(
"डेटा सुरक्षित कर दिया गया है।"
);

}


/* =====================================================
   LOAD
===================================================== */

function loadData(){

const raw =
localStorage.getItem(
"deoMarksFolio_Final_v8"
);


if(raw){

try{

const d =
JSON.parse(raw);


if(
d.subjects &&
Array.isArray(d.subjects)
){

subjects=d.subjects;

}


if(d.details){

details =
Object.assign(
details,
d.details
);

}


if(
d.students &&
Array.isArray(d.students)
){

students=d.students;

}

}

catch(e){}

}


renderSubjectControls();


if(students.length===0){

for(
let i=0;
i<30;
i++
){

students.push({

roll:"",
name:"",
marks:
new Array(
subjects.length
).fill("")

});

}

}


students.forEach(s=>{

while(
s.marks.length <
subjects.length
){

s.marks.push("");

}

});


renderPages();

syncFormOptions();

selectedStudent=0;

selectStudent();

}


/* =====================================================
   CLEAR
===================================================== */

function clearData(){

if(
confirm(
"क्या आप पूरा डेटा रीसेट करना चाहते हैं?"
)
){

localStorage.removeItem(
"deoMarksFolio_Final_v8"
);

location.reload();

}

}
