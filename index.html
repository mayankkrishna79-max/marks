<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0d6efd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>DEO Office - Marks Folio</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

@page {
  size: A4 portrait;
  margin: 0;
}

* {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  margin: 0;
  padding: 8px;
  background: #eef1f5;
  font-family:
    "Nirmala UI",
    "Mangal",
    "Arial Unicode MS",
    Arial,
    sans-serif;
  color: #111;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
  background: #fff;
  border-radius: 8px;
  padding: 8px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px #0002;
  margin-bottom: 8px;
  position: sticky;
  top: 0;
  z-index: 100;
}

button {
  border: 0;
  border-radius: 6px;
  padding: 7px 11px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.98);
}

.primary {
  background: #0d6efd;
  color: #fff;
}

.green {
  background: #198754;
  color: #fff;
}

.gray {
  background: #6c757d;
  color: #fff;
}

.danger {
  background: #dc3545;
  color: #fff;
}

.warning {
  background: #fd7e14;
  color: #fff;
}

.share-btn {
  background: #6f42c1;
  color: #fff;
}

.view-badge {
  background: #e9ecef;
  color: #333;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
}

/* =========================================================
   ENTRY PANEL
========================================================= */

.entry-panel {
  background: #fff;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px #0002;
}

.entry-title {
  font-size: 15.5px;
  font-weight: 800;
  margin-bottom: 8px;
  color: #0d6efd;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.entry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 6px;
}

.entry-grid label {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 2px;
  display: block;
}

.entry-grid input,
.entry-grid select {
  width: 100%;
  padding: 7px 8px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-family: inherit;
  font-size: 13.5px;
  background: #fff;
  outline: none;
}

.entry-grid input:focus,
.entry-grid select:focus {
  border-color: #0d6efd;
  box-shadow: 0 0 0 2px #0d6efd22;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
  gap: 5px;
  margin-top: 8px;
}

.subject-box {
  border: 1px solid #ddd;
  border-radius: 5px;
  padding: 4px;
  background: #fafafa;
}

.subject-box input.sub-name {
  border: 0;
  border-bottom: 1px dashed #888;
  border-radius: 0;
  background: transparent;
  font-weight: 700;
  font-size: 11.5px;
  text-align: center;
  padding: 2px 0;
  margin-bottom: 3px;
  width: 100%;
  outline: none;
}

.subject-box input.sub-marks {
  width: 100%;
  padding: 6px 4px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-size: 13.5px;
  text-align: center;
  background: #fff;
  outline: none;
}

.subject-box input.sub-marks:focus {
  border-color: #0d6efd;
  box-shadow: 0 0 0 2px #0d6efd22;
}

.status {
  font-size: 11.5px;
  color: #198754;
  font-weight: 700;
  margin-top: 6px;
}

.form-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.form-actions button {
  flex: 1;
  padding: 8px;
}

/* =========================================================
   FOLIO PREVIEW
========================================================= */

/*
   Mobile पर पूरा A4 horizontal scroll हो सकेगा।
   साथ ही vertical scroll भी इसी container में रहेगा।
*/

.paper-container {
  width: 100%;
  max-width: 100%;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 8px 5px 20px;
  background: #dfe3e8;
  border-radius: 8px;

  /*
     Mobile में ऊपर-नीचे आसानी से scroll करने के लिए
  */
  max-height: calc(100vh - 235px);
}

.pages-wrap {
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
  width: max-content;
  min-width: 100%;
}

/* =========================================================
   A4 PAGE
========================================================= */

.paper {
  width: 210mm;
  height: 297mm;
  min-width: 210mm;
  max-width: 210mm;

  background: #fff;

  padding: 3mm 7.5mm 2.5mm;

  box-shadow: 0 2px 10px #0002;

  display: flex;
  flex-direction: column;

  box-sizing: border-box;

  overflow: hidden;

  position: relative;

  page-break-after: always;
  page-break-inside: avoid;

  break-after: page;
  break-inside: avoid;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  flex-shrink: 0;
  text-align: center;
  margin-bottom: 0.8mm;
}

.h1 {
  font-size: 15.5px;
  font-weight: 700;
  text-decoration: underline;
  margin: 0;
  line-height: 1.2;
}

.h2 {
  font-size: 14px;
  font-weight: 700;
  text-decoration: underline;
  margin-top: 1px;
}

/* =========================================================
   INFORMATION
========================================================= */

.info {
  flex-shrink: 0;
  font-size: 11.5px;
  line-height: 1.4;
  margin-bottom: 1mm;
}

.info-row {
  display: grid;
  grid-template-columns: 29mm 1fr 19mm 1fr;
  gap: 2mm;
  align-items: end;
}

.info-row.wide {
  grid-template-columns: 29mm 1fr;
}

.info label {
  font-weight: 700;
  white-space: nowrap;
}

.info input {
  width: 100%;
  border: 0;
  border-bottom: 1px dotted #555;
  outline: 0;
  font-family: inherit;
  font-size: 11.5px;
  height: 4.8mm;
  padding: 0 1mm;
  background: transparent;
}

.info .marks {
  font-weight: 700;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap {
  flex-shrink: 0;
  display: block;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 11px;
}

th,
td {
  border: 0.3mm solid #222;
  text-align: center;
  padding: 0;
}

thead th {
  height: 8mm;
  font-weight: 700;
  vertical-align: middle;
  line-height: 1.1;
  font-size: 11px;
}

tbody tr {
  height: 7.2mm;
  max-height: 7.2mm;
}

th.col-sr,
td.col-sr {
  width: 9mm;
}

th.col-roll,
td.col-roll {
  width: 11.5mm;
}

th.col-name,
td.col-name {
  width: auto;
}

th.col-sub,
td.col-sub {
  width: 13mm;
}

th.col-total,
td.col-total {
  width: 12mm;
}

th.col-grade,
td.col-grade {
  width: 14mm;
}

td input {
  width: 100%;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  text-align: center;
  font-family: inherit;
  font-size: 11.5px;
  padding: 0;
  font-weight: 500;
}

td.name input {
  text-align: left;
  padding-left: 1.5mm;
  font-size: 11.5px;
}

td.total {
  font-weight: 700;
  font-size: 11.5px;
}

td.grade {
  font-weight: 800;
  font-size: 12px;
}

/* =========================================================
   NOTE
========================================================= */

tfoot td.note-cell {
  border: 0 !important;
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  padding-top: 1mm;
  padding-bottom: 0.5mm;
  line-height: 1.15;
}

/* =========================================================
   SIGNATURE
========================================================= */

.signatures {
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5mm;
  margin-bottom: 1.5mm;
  font-size: 10.5px;
  font-weight: 700;
  text-align: center;
  page-break-inside: avoid;
  break-inside: avoid;
}

.sig {
  border-top: 1px dashed #666;
  padding-top: 9mm;
  line-height: 1.25;
}

/* =========================================================
   MODAL
========================================================= */

.dialog-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 15px;
}

.dialog-box {
  background: #fff;
  border-radius: 8px;
  padding: 16px;
  width: 90%;
  max-width: 320px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* =========================================================
   WHATSAPP FOLLOW POPUP
========================================================= */

.popup-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 15px;
}

.popup {
  width: 100%;
  max-width: 350px;
  background: white;
  border-radius: 14px;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

.popup h3 {
  margin: 0 0 10px;
  font-size: 19px;
  color: #111;
}

.popup p {
  margin: 0 0 18px;
  line-height: 1.5;
  font-size: 13.5px;
  color: #444;
}

.follow-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #25D366;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px;
  font-weight: 800;
  font-size: 15px;
  width: 100%;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(37,211,102,0.3);
}

.small {
  font-size: 11px;
  color: #888;
  margin-top: 12px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  body {
    padding: 4px;
  }

  .toolbar {
    position: sticky;
    top: 0;
    padding: 6px;
  }

  .toolbar button {
    flex: 1 1 calc(33.33% - 5px);
    padding: 8px 4px;
    font-size: 12px;
    min-height: 36px;
  }

  .view-badge {
    width: 100%;
    justify-content: center;
    margin-left: 0;
    order: -1;
    margin-bottom: 4px;
  }

  .entry-panel {
    padding: 8px;
  }

  .entry-title {
    font-size: 14px;
  }

  .entry-grid {
    grid-template-columns: 1fr 1fr;
  }

  .entry-grid > div:last-child {
    grid-column: 1 / -1;
  }

  .subject-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  /*
    सबसे महत्वपूर्ण:
    Mobile पर A4 की width को छोटा नहीं किया गया है।
    Horizontal scroll से सभी columns दिखेंगे।
  */

  .paper-container {
    max-height: calc(100vh - 220px);
    min-height: 400px;
    overflow-x: auto;
    overflow-y: auto;
    touch-action: pan-x pan-y;
  }

  .pages-wrap {
    align-items: flex-start;
  }

  .paper {
    margin: 0;
  }
}

/* =========================================================
   PRINT
========================================================= */

@media print {

  html,
  body {
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: visible !important;
  }

  .toolbar,
  .entry-panel,
  .dialog-bg,
  .popup-bg {
    display: none !important;
  }

  .paper-container {
    overflow: visible !important;
    padding: 0 !important;
    max-height: none !important;
    background: #fff !important;
  }

  .pages-wrap {
    gap: 0 !important;
    width: auto !important;
  }

  .paper {
    margin: 0 !important;
    width: 210mm !important;
    min-width: 210mm !important;
    height: 297mm !important;
    max-height: 297mm !important;
    box-shadow: none !important;

    padding: 3mm 7.5mm 2.5mm !important;

    page-break-after: always !important;
    page-break-inside: avoid !important;

    break-after: page !important;
    break-inside: avoid !important;
  }

  input {
    color: #000 !important;
  }
}

</style>
</head>

<script>

/* ==========================================================
   SETTINGS
========================================================== */

/*
   आपका WhatsApp Channel Link
*/
const CHANNEL_LINK =
"https://whatsapp.com/channel/0029VaIhMoY35fM4YK5xrz3P";


/*
   प्रत्येक विषय का पूर्णांक
*/
const SUBJECT_FULL_MARKS = 50;


/*
   एक पेज पर 30 विद्यार्थी
*/
const ROWS_PER_PAGE = 30;


/*
   Default Subjects
*/
let subjects = [
  "हिंदी",
  "गणित",
  "अंग्रेजी",
  "संस्कृत",
  "सा० विज्ञान",
  "विज्ञान"
];


/*
   Students
*/
let students = [];


/*
   Details
*/
let details = {
  center: "",
  district: "",
  school: "",
  udise: "",
  block: "",
  className: ""
};


/*
   Selected Student
*/
let selectedStudent = 0;


/* ==========================================================
   ESCAPE HTML
========================================================== */

function esc(s) {

  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* ==========================================================
   GRADE CALCULATION
========================================================== */

/*
   Grade calculation:

   81-100 = A
   61-80  = B
   41-60  = C
   33-40  = D
   0-32   = E

   AB / ABSENT = 0
*/

function getGrade(total, subjectCount) {

  if (!subjectCount) {
    return "";
  }

  const fullMarks =
    subjectCount * SUBJECT_FULL_MARKS;

  const percentage =
    (total / fullMarks) * 100;


  if (percentage >= 81) {
    return "A";
  }

  if (percentage >= 61) {
    return "B";
  }

  if (percentage >= 41) {
    return "C";
  }

  if (percentage >= 33) {
    return "D";
  }

  return "E";
}


/* ==========================================================
   CALCULATE STUDENT TOTAL
========================================================== */

function calculateStudent(st) {

  let total = 0;
  let hasAnyEntry = false;

  for (
    let s = 0;
    s < subjects.length;
    s++
  ) {

    const value =
      String(st.marks[s] || "").trim();

    if (value !== "") {

      hasAnyEntry = true;

      const upper =
        value.toUpperCase();


      /*
         AB / ABSENT = 0
      */

      if (
        upper === "AB" ||
        upper === "ABSENT"
      ) {

        continue;

      }


      /*
         Numeric marks
      */

      if (!isNaN(Number(value))) {

        let mark = Number(value);

        /*
           Maximum 50
        */

        if (mark > 50) {
          mark = 50;
        }

        if (mark < 0) {
          mark = 0;
        }

        total += mark;

      }

    }

  }


  const grade =
    hasAnyEntry
      ? getGrade(total, subjects.length)
      : "";


  return {
    total,
    grade,
    hasAnyEntry
  };

}

/* ==========================================================
   CELL MARK CHANGE
========================================================== */

function cellChanged(
  stIdx,
  subIdx,
  val,
  inputElement
) {

  if (
    !students[stIdx]
  ) {
    return;
  }


  /*
     AB / ABSENT allowed
  */

  let value =
    String(val || "");


  /*
     Numeric value maximum 50
  */

  if (
    value !== "" &&
    value.toUpperCase() !== "AB" &&
    value.toUpperCase() !== "ABSENT"
  ) {

    const number =
      Number(value);


    if (
      !isNaN(number)
    ) {

      if (number > 50) {

        value = "50";

        if (inputElement) {
          inputElement.value = "50";
        }

      }

      if (number < 0) {

        value = "0";

        if (inputElement) {
          inputElement.value = "0";
        }

      }

    }

  }


  students[stIdx]
    .marks[subIdx] =
    value;


  /*
     Update Entry Panel
  */

  if (
    stIdx === selectedStudent
  ) {

    const formInput =
      document.getElementById(
        "m" + subIdx
      );


    if (
      formInput &&
      formInput !== inputElement
    ) {

      formInput.value =
        value;

    }

  }


  /*
     Recalculate only total and grade
     instead of rerendering whole page.
     इससे typing और scroll नहीं टूटेगा।
  */

  updateStudentResult(
    stIdx
  );


  autoSave();

}


/* ==========================================================
   UPDATE TOTAL + GRADE
========================================================== */

function updateStudentResult(
  stIdx
) {

  const result =
    calculateStudent(
      students[stIdx]
    );


  const totalElement =
    document.getElementById(
      "total-" + stIdx
    );


  const gradeElement =
    document.getElementById(
      "grade-" + stIdx
    );


  if (totalElement) {

    totalElement.textContent =
      result.hasAnyEntry
        ? result.total
        : "0";

  }


  if (gradeElement) {

    gradeElement.textContent =
      result.grade;

  }

}


/* ==========================================================
   STUDENT INFO CHANGE
========================================================== */

function cellInfoChanged(
  stIdx,
  key,
  val
) {

  if (
    !students[stIdx]
  ) {
    return;
  }


  students[stIdx][key] =
    val;


  if (
    stIdx === selectedStudent
  ) {

    if (
      key === "name"
    ) {

      document.getElementById(
        "formName"
      ).value = val;

    }


    if (
      key === "roll"
    ) {

      document.getElementById(
        "formRoll"
      ).value = val;

    }

  }


  /*
     Update dropdown name
  */

  updateStudentDropdownOnly();


  autoSave();

}


/* ==========================================================
   UPDATE DROPDOWN
========================================================== */

function updateStudentDropdownOnly() {

  const select =
    document.getElementById(
      "studentSelect"
    );


  if (!select) {
    return;
  }


  const current =
    selectedStudent;


  select.innerHTML =
    students
      .map(
        (student, index) => {

          return `

            <option value="${index}">

              ${index + 1}.
              ${
                student.name ||
                "नया विद्यार्थी"
              }

            </option>

          `;

        }
      )
      .join("");


  selectedStudent =
    Math.min(
      current,
      Math.max(
        0,
        students.length - 1
      )
    );


  select.value =
    selectedStudent;

}


/* ==========================================================
   SELECT STUDENT
========================================================== */

function selectStudent() {

  const select =
    document.getElementById(
      "studentSelect"
    );


  selectedStudent =
    Number(select.value) || 0;


  const st =
    students[selectedStudent];


  if (!st) {
    return;
  }


  document.getElementById(
    "formRoll"
  ).value =
    st.roll || "";


  document.getElementById(
    "formName"
  ).value =
    st.name || "";


  for (
    let i = 0;
    i < subjects.length;
    i++
  ) {

    const input =
      document.getElementById(
        "m" + i
      );


    if (input) {

      input.value =
        st.marks[i] || "";

    }

  }

}


/* ==========================================================
   FORM CHANGE
========================================================== */

function formChanged() {

  const st =
    students[selectedStudent];


  if (!st) {
    return;
  }


  st.roll =
    document.getElementById(
      "formRoll"
    ).value;


  st.name =
    document.getElementById(
      "formName"
    ).value;


  for (
    let i = 0;
    i < subjects.length;
    i++
  ) {

    const input =
      document.getElementById(
        "m" + i
      );


    if (input) {

      st.marks[i] =
        input.value;

    }

  }


  /*
     Update table inputs directly
  */

  const pageInputSelectors =
    document.querySelectorAll(
      "#pagesWrap input"
    );


  /*
     Only update current student's
     table row.
  */

  const pageRows =
    document.querySelectorAll(
      "#pagesWrap tbody tr"
    );


  let currentRow = null;


  pageRows.forEach(
    (row, index) => {

      if (
        index === selectedStudent
      ) {

        currentRow =
          row;

      }

    }
  );


  if (currentRow) {

    const inputs =
      currentRow.querySelectorAll(
        "input"
      );


    if (inputs[0]) {
      inputs[0].value =
        st.roll;
    }


    if (inputs[1]) {
      inputs[1].value =
        st.name;
    }


    for (
      let i = 0;
      i < subjects.length;
      i++
    ) {

      if (inputs[i + 2]) {

        inputs[i + 2].value =
          st.marks[i] || "";

      }

    }

  }


  updateStudentResult(
    selectedStudent
  );


  updateStudentDropdownOnly();


  document.getElementById(
    "studentSelect"
  ).value =
    selectedStudent;


  autoSave();

}


/* ==========================================================
   ADD STUDENT
========================================================== */

function addStudent() {

  students.push({

    roll: "",

    name: "",

    marks:
      new Array(
        subjects.length
      ).fill("")

  });


  renderPages();


  updateStudentDropdownOnly();


  selectedStudent =
    students.length - 1;


  document.getElementById(
    "studentSelect"
  ).value =
    selectedStudent;


  selectStudent();


  autoSave();


  /*
     Entry panel पर वापस
  */

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==========================================================
   REMOVE LAST STUDENT
========================================================== */

function removeStudent() {

  if (
    students.length <= 1
  ) {

    alert(
      "कम से कम एक विद्यार्थी रखना आवश्यक है।"
    );

    return;

  }


  const last =
    students[students.length - 1];


  const studentName =
    last.name ||
    `विद्यार्थी ${students.length}`;


  if (
    !confirm(
      `"${studentName}" को हटाना चाहते हैं?`
    )
  ) {

    return;

  }


  students.pop();


  selectedStudent =
    Math.min(
      selectedStudent,
      students.length - 1
    );


  renderPages();

  updateStudentDropdownOnly();

  document.getElementById(
    "studentSelect"
  ).value =
    selectedStudent;

  selectStudent();

  autoSave();


  alert(
    "अंतिम विद्यार्थी हटा दिया गया।"
  );

}


/* ==========================================================
   NEXT STUDENT
========================================================== */

function nextStudent() {

  if (
    selectedStudent <
    students.length - 1
  ) {

    selectedStudent++;

    document.getElementById(
      "studentSelect"
    ).value =
      selectedStudent;

    selectStudent();

  }

  else {

    addStudent();

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==========================================================
   AUTOSAVE
========================================================== */

function autoSave() {

  try {

    localStorage.setItem(

      "deoMarksFolio_Final_v7",

      JSON.stringify({

        subjects,

        details,

        students

      })

    );


    const status =
      document.getElementById(
        "saveStatus"
      );


    if (status) {

      status.textContent =
        "✓ Auto-saved • " +
        new Date()
          .toLocaleTimeString(
            "hi-IN"
          );

    }

  }

  catch (e) {

    console.error(
      "Auto save failed",
      e
    );

  }

}


/* ==========================================================
   SAVE
========================================================== */

function saveData() {

  autoSave();

  alert(
    "✅ डेटा सुरक्षित कर दिया गया है।"
  );

}


/* ==========================================================
   LOAD DATA
========================================================== */

function loadData() {

  try {

    const raw =
      localStorage.getItem(
        "deoMarksFolio_Final_v7"
      );


    if (raw) {

      const data =
        JSON.parse(raw);


      if (
        Array.isArray(
          data.subjects
        ) &&
        data.subjects.length
      ) {

        subjects =
          data.subjects;

      }


      if (
        data.details
      ) {

        details =
          Object.assign(
            details,
            data.details
          );

      }


      if (
        Array.isArray(
          data.students
        )
      ) {

        students =
          data.students;

      }

    }

  }

  catch (e) {

    console.error(
      "Load error",
      e
    );

  }


  /*
     यदि कोई student नहीं है
     तो 30 blank students
  */

  if (
    students.length === 0
  ) {

    for (
      let i = 0;
      i < ROWS_PER_PAGE;
      i++
    ) {

      students.push({

        roll: "",

        name: "",

        marks:
          new Array(
            subjects.length
          ).fill("")

      });

    }

  }


  /*
     पुराने data में marks कम हों
     तो नए subjects के लिए blank add करें
  */

  students.forEach(
    student => {

      if (
        !Array.isArray(
          student.marks
        )
      ) {

        student.marks = [];

      }


      while (
        student.marks.length <
        subjects.length
      ) {

        student.marks.push("");

      }


      /*
         Extra marks remove
      */

      if (
        student.marks.length >
        subjects.length
      ) {

        student.marks =
          student.marks.slice(
            0,
            subjects.length
          );

      }

    }
  );


  renderSubjectControls();

  renderPages();

  updateStudentDropdownOnly();


  selectedStudent = 0;


  document.getElementById(
    "studentSelect"
  ).value = 0;


  selectStudent();

}


/* ==========================================================
   CLEAR DATA
========================================================== */

function clearData() {

  const answer =
    confirm(
      "⚠️ क्या आप पूरा Marks Folio डेटा रीसेट करना चाहते हैं?\n\nसभी विद्यार्थी, अंक और विवरण हट जाएंगे।"
    );


  if (!answer) {
    return;
  }


  localStorage.removeItem(
    "deoMarksFolio_Final_v7"
  );


  /*
     पुराने version का data भी हटाएं
  */

  localStorage.removeItem(
    "deoMarksFolio_Final_v6"
  );


  location.reload();

}


/* ==========================================================
   DOWNLOAD PDF
========================================================== */

function downloadPDF() {

  const element =
    document.getElementById(
      "pagesWrap"
    );


  const className =
    details.className ||
    "Report";


  const safeName =
    className
      .replace(
        /[\\/:*?"<>|]/g,
        "_"
      );


  const opt = {

    margin: 0,

    filename:
      `Marks_Folio_${safeName}.pdf`,

    image: {

      type: "jpeg",

      quality: 0.98

    },

    html2canvas: {

      scale: 2,

      useCORS: true,

      scrollY: 0,

      scrollX: 0

    },

    jsPDF: {

      unit: "mm",

      format: "a4",

      orientation: "portrait"

    },

    pagebreak: {

      mode: [
        "css",
        "legacy"
      ]

    }

  };


  html2pdf()
    .set(opt)
    .from(element)
    .save();

}


/* ==========================================================
   INITIALIZE
========================================================== */

loadData();

checkMandatoryPopup();

updateViews();

</script>
